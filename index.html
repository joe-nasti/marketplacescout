<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f8ff">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./collectish-icon-192.png">
  <link rel="stylesheet" href="./src/styles/index.css">
  <title>Collectish</title>
  <style>
    #collectishBootFallback{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f8ff;color:#0b1538;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #collectishBootFallback>div{width:min(360px,100%);text-align:center;padding:24px;border-radius:18px;background:#fff;border:1px solid #d9e3f1;box-shadow:0 10px 30px rgba(11,21,56,.08)}
    #collectishBootFallback strong{display:block;font-size:28px;letter-spacing:-1px}#collectishBootFallback span,#collectishBootFallback small{display:block;margin-top:8px;color:#64718b;font-size:13px;word-break:break-word}
  </style>
  <script>
    (function(){
      window.__collectishBootErrors=[];
      function remember(msg){
        window.__collectishBootErrors.push(String(msg||'unknown error'));
        if(window.__collectishBootErrors.length>8)window.__collectishBootErrors=window.__collectishBootErrors.slice(-8);
      }
      window.addEventListener('error',function(e){remember(e.message||e.error||('resource failed: '+(e.target&&e.target.src||e.target&&e.target.href||'unknown')))},true);
      window.addEventListener('unhandledrejection',function(e){remember(e.reason&&e.reason.message||e.reason||'unhandled rejection')});
      window.setTimeout(function(){
        var host=document.getElementById('collectishBootFallback'); if(!host)return;
        var span=host.querySelector('span'); if(span)span.textContent='Startup has not completed.';
        var d=host.querySelector('div'); if(!d)return;
        var details=document.createElement('small');
        details.id='collectishBootDiagnostic';
        details.textContent=(window.__collectishBootErrors.length?window.__collectishBootErrors.join(' | '):'No JavaScript error surfaced')+' · '+location.pathname+location.search+' · '+navigator.userAgent;
        d.appendChild(details);
      },7000);
    })();
  </script>
</head>
<body>
  <main id="collectishBootFallback"><div><strong>collectish</strong><span>Loading Collectish…</span></div></main>
  <noscript>Collectish requires JavaScript.</noscript>
  <script type="module">
    async function waitForController(timeout=2500){
      if(navigator.serviceWorker?.controller)return true;
      return await new Promise(resolve=>{
        let done=false;
        const finish=value=>{if(done)return;done=true;clearTimeout(timer);navigator.serviceWorker?.removeEventListener('controllerchange',onChange);resolve(value)};
        const onChange=()=>finish(true);
        const timer=setTimeout(()=>finish(!!navigator.serviceWorker?.controller),timeout);
        navigator.serviceWorker?.addEventListener('controllerchange',onChange,{once:true});
      });
    }
    async function clearNativeWorkerState(){
      try{
        const regs=await navigator.serviceWorker?.getRegistrations?.()||[];
        await Promise.allSettled(regs.map(reg=>reg.unregister()));
      }catch(error){window.__collectishBootErrors?.push(`native-worker-clear: ${error?.message||error}`)}
      try{
        const keys=await caches?.keys?.()||[];
        await Promise.allSettled(keys.map(key=>caches.delete(key)));
      }catch(error){window.__collectishBootErrors?.push(`native-cache-clear: ${error?.message||error}`)}
    }
    async function boot(){
      const nonce=Date.now();
      window.__collectishBootNonce=nonce;
      const nativeAndroid=Boolean(window.CollectishAndroid);
      if(nativeAndroid){
        // Hashed Vite assets are immutable and safe to reuse. Retire any legacy
        // worker without holding the Android first paint behind storage cleanup.
        void clearNativeWorkerState();
      }else if('serviceWorker' in navigator){
        try{
          await navigator.serviceWorker.register(`./sw.mjs?boot=${nonce}`,{scope:'./',type:'module',updateViaCache:'none'});
          await navigator.serviceWorker.ready;
          await waitForController();
        }catch(error){window.__collectishBootErrors?.push(`fresh-loader: ${error?.message||error}`)}
      }
      await import('./src/main.js');
    }
    boot().catch(error=>{
      window.__collectishBootErrors?.push(String(error?.message||error));
      throw error;
    });
  </script>
</body>
</html>
