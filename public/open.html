<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f8ff">
  <title>Open Collectish</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f8ff;color:#0b1538;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(380px,100%);padding:28px;border:1px solid #d9e3f1;border-radius:20px;background:#fff;box-shadow:0 10px 30px rgba(11,21,56,.08);text-align:center}h1{margin:0 0 8px;font-size:30px}p{margin:0 0 22px;color:#64718b;line-height:1.45}.open{display:block;width:100%;padding:14px 18px;border-radius:12px;background:#0b1538;color:#fff;text-decoration:none;font-weight:700;font-size:17px}.web{display:inline-block;margin-top:16px;color:#315fce;text-decoration:none;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <h1>collectish</h1>
    <p>Open this Scout result in the installed Collectish app.</p>
    <a id="openApp" class="open" href="#">Open in Collectish</a>
    <a id="openWeb" class="web" href="#">Continue in browser</a>
  </main>
  <script>
    (function(){
      var incoming=new URL(location.href), target=new URL('/marketplacescout/',location.origin);
      incoming.searchParams.forEach(function(v,k){if(k!=='target'&&k!=='open')target.searchParams.append(k,v)});
      target.searchParams.delete('webFallback');target.searchParams.delete('nativeHost');
      var fallback=new URL(target.toString());fallback.searchParams.set('webFallback','1');
      var intent='intent://joe-nasti.github.io'+target.pathname+target.search+'#Intent;scheme=https;package=com.collectish.agent;S.browser_fallback_url='+encodeURIComponent(fallback.toString())+';end';
      document.getElementById('openApp').href=intent;
      document.getElementById('openWeb').href=fallback.toString();
    })();
  </script>
</body>
</html>
