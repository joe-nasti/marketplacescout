name: Deploy Discord Ask Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloud-worker/discord-ask-worker.mjs'
      - 'cloud-worker/discord-ask-entry.mjs'
      - 'cloud-worker/discord-ask-entry-v2.mjs'
      - 'cloud-worker/discord-ask-entry-v3.mjs'
      - 'cloud-worker/discord-ask-entry-v4.mjs'
      - 'cloud-worker/discord-ask-entry-v5.mjs'
      - 'cloud-worker/discord-ask-entry-v6.mjs'
      - 'cloud-worker/discord-ask-entry-v7.mjs'
      - 'cloud-worker/discord-ask-entry-v8.mjs'
      - 'cloud-worker/discord-ask-entry-v9.mjs'
      - 'cloud-worker/discord-ask-entry-v10.mjs'
      - 'cloud-worker/discord-ask-entry-v11.mjs'
      - 'cloud-worker/discord-ask-entry-v12.mjs'
      - 'cloud-worker/discord-ask-entry-v13.mjs'
      - 'cloud-worker/discord-ask-entry-v14.mjs'
      - 'cloud-worker/discord-ask-entry-v15.mjs'
      - 'cloud-worker/discord-ask-entry-v16.mjs'
      - 'cloud-worker/discord-ask-entry-v17.mjs'
      - 'cloud-worker/discord-ask-entry-v18.mjs'
      - 'cloud-worker/discord-ask-entry-v19.mjs'
      - 'cloud-worker/discord-ask-entry-v20.mjs'
      - 'cloud-worker/discord-ask-entry-v21.mjs'
      - 'cloud-worker/discord-ask-entry-v22.mjs'
      - 'cloud-worker/discord-ask-entry-v23.mjs'
      - 'cloud-worker/discord-ask-entry-v24.mjs'
      - 'cloud-worker/discord-ask-entry-v25.mjs'
      - 'cloud-worker/discord-ask-entry-v26.mjs'
      - 'cloud-worker/discord-ask-entry-v27.mjs'
      - 'cloud-worker/discord-ask-entry-v28.mjs'
      - 'cloud-worker/discord-ask-entry-v29.mjs'
      - 'cloud-worker/discord-ask-entry-v30.mjs'
      - 'cloud-worker/discord-shared-delvin-route.mjs'
      - 'supabase/functions/ask-collectish-delvin-present-v3/**'
      - 'cloud-worker/discord-structured-output.mjs'
      - 'cloud-worker/discord-fast-query-cache.mjs'
      - 'cloud-worker/discord-market-intel-fast.mjs'
      - 'cloud-worker/discord-card-investigator.mjs'
      - 'cloud-worker/discord-family-set-intel.mjs'
      - 'cloud-worker/discord-signal-history.mjs'
      - 'cloud-worker/discord-user-watches.mjs'
      - 'cloud-worker/wrangler.discord-ask.json'
      - 'tools/check-discord-ask-routing.mjs'
      - '.github/workflows/deploy-discord-ask-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_LINK_STATE_KV_ID: ${{ secrets.DISCORD_LINK_STATE_KV_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Discord routing ownership
        run: node tools/check-discord-ask-routing.mjs

      - name: Validate Cloudflare deployment settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "${DISCORD_LINK_STATE_KV_ID}" || { echo "Missing DISCORD_LINK_STATE_KV_ID repository secret"; exit 1; }
          test -n "${DISCORD_BOT_TOKEN}" || { echo "Missing DISCORD_BOT_TOKEN repository secret"; exit 1; }
          [[ "${DISCORD_LINK_STATE_KV_ID}" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "DISCORD_LINK_STATE_KV_ID must be a 32-character Cloudflare KV namespace id"; exit 1; }

      - name: Build runtime Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = 'cloud-worker/wrangler.discord-ask.json';
          const target = 'cloud-worker/wrangler.discord-ask.runtime.json';
          const kvId = process.env.DISCORD_LINK_STATE_KV_ID;
          const config = JSON.parse(fs.readFileSync(source, 'utf8'));
          const kv = config.kv_namespaces?.find((entry) => entry.binding === 'DISCORD_LINK_STATE');
          if (!kv) throw new Error('DISCORD_LINK_STATE binding is missing from Wrangler config');
          kv.id = kvId;
          fs.writeFileSync(target, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Deploy Worker and Queue consumer
        run: npx --yes wrangler@4 deploy --config cloud-worker/wrangler.discord-ask.runtime.json

      - name: Update Discord bot token secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${DISCORD_BOT_TOKEN}" | npx --yes wrangler@4 secret put DISCORD_BOT_TOKEN --config cloud-worker/wrangler.discord-ask.runtime.json

      - name: Audit live Worker binding names
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/collectish-discord-ask/settings" \
            | jq -c '.result.bindings | map({name, type})'

      - name: Verify Worker health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 2 \
            https://collectish-discord-ask.collectish.workers.dev/healthz
          echo
