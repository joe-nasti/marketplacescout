      - 'supabase/migrations/20260902044000_ask_timeline_mtgstocks_fallback_anchor.sql'
      - 'supabase/migrations/20260903010000_market_wide_supply_depth.sql'
      - 'supabase/migrations/20260904193000_family_printing_opportunity_demand.sql'
      - 'src/modules/index.js'
      - 'src/modules/ask/endpoint-proxy.js'
      - 'src/modules/ask/structured-surfaces.js'
      - 'src/modules/ask/surface-persistence.js'
      - 'tools/check-ask-history-routing.mjs'
      - 'tools/check-ask-context-isolation.mjs'
      - 'tools/check-ask-price-history-chart.mjs'
      - 'tools/check-ask-surface-boot-order.mjs'
      - 'tools/check-ask-surface-persistence.mjs'
      - 'tools/check-ask-causal-move-routing.mjs'
      - 'tools/check-ask-move-family-identity.mjs'
      - 'tools/check-ask-causal-evidence.mjs'
      - 'tools/check-ask-market-research-fallback.mjs'
      - 'tools/check-ask-shared-market-evidence.mjs'
      - 'tools/check-ask-market-wide-supply.mjs'
