      - 'tools/check-ask-video-creator-taxonomy.mjs'
      - 'tools/check-ask-two-pass-creator-retrieval.mjs'
      - 'tools/check-ask-web-citation-source-extraction.mjs'
      - 'tools/check-ask-causal-grounding-fallback.mjs'
      - 'tools/check-ask-causal-specificity-precedence.mjs'
      - '.github/workflows/ask-history-routing-guard.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/ask-collectish-route-intents/**'
      - 'supabase/functions/ask-collectish-api/**'
      - 'supabase/functions/ask-collectish-identity-recovery/**'
      - 'supabase/functions/ask-collectish-orchestrator/**'
      - 'supabase/functions/ask-collectish-web-research/**'
      - 'supabase/functions/market-supply-sync/**'
      - 'supabase/functions/manapool-supply-sync/**'
      - 'cloud-worker/manapool-depth-sync.mjs'
      - 'supabase/migrations/20260831163500_normalize_ask_slash_command_lookup.sql'
      - 'supabase/migrations/20260831195300_normalize_ask_resolver_history_prompts.sql'
      - 'supabase/migrations/20260831200700_make_ask_price_history_index_native.sql'
      - 'supabase/migrations/20260901140500_ask_market_research_scan_fallback.sql'
      - 'supabase/migrations/20260901144700_make_ask_market_research_shared_across_clients.sql'
      - 'supabase/migrations/20260901164500_share_mtgstocks_signals_with_authenticated_clients.sql'
      - 'supabase/migrations/20260902044000_ask_timeline_mtgstocks_fallback_anchor.sql'
      - 'supabase/migrations/20260903010000_market_wide_supply_depth.sql'
      - 'supabase/migrations/20260904193000_family_printing_opportunity_demand.sql'
      - 'src/modules/index.js'
      - 'src/modules/ask/endpoint-proxy.js'
      - 'src/modules/ask/structured-surfaces.js'
      - 'src/modules/ask/surface-persistence.js'
      - 'tools/check-ask-history-routing.mjs'
      - 'tools/check-ask-context-isolation.mjs'
      - 'tools/check-ask-price-history-chart.mjs'
      - 'tools/check-ask-surface-boot-order.mjs'
      - 'tools/check-ask-surface-persistence.mjs'
      - 'tools/check-ask-causal-move-routing.mjs'
      - 'tools/check-ask-move-family-identity.mjs'
      - 'tools/check-ask-causal-evidence.mjs'
      - 'tools/check-ask-market-research-fallback.mjs'
      - 'tools/check-ask-shared-market-evidence.mjs'
      - 'tools/check-ask-market-wide-supply.mjs'
      - 'tools/check-printing-opportunity-demand.mjs'
      - 'tools/check-ask-video-creator-taxonomy.mjs'
      - 'tools/check-ask-two-pass-creator-retrieval.mjs'
      - 'tools/check-ask-web-citation-source-extraction.mjs'
      - 'tools/check-ask-causal-grounding-fallback.mjs'
      - 'tools/check-ask-causal-specificity-precedence.mjs'
      - '.github/workflows/ask-history-routing-guard.yml'
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-ask-history-routing.mjs
      - run: node tools/check-ask-context-isolation.mjs
      - run: node tools/check-ask-price-history-chart.mjs
      - run: node tools/check-ask-surface-boot-order.mjs
      - run: node tools/check-ask-surface-persistence.mjs
      - run: node tools/check-ask-causal-move-routing.mjs
      - run: node tools/check-ask-market-wide-supply.mjs
      - run: node tools/check-printing-opportunity-demand.mjs
      - run: node tools/check-ask-move-family-identity.mjs
      - run: node tools/check-ask-causal-evidence.mjs
      - run: node tools/check-ask-market-research-fallback.mjs
      - run: node tools/check-ask-shared-market-evidence.mjs
      - run: node tools/check-ask-video-creator-taxonomy.mjs
      - run: node tools/check-ask-two-pass-creator-retrieval.mjs
      - run: node tools/check-ask-web-citation-source-extraction.mjs
      - run: node tools/check-ask-causal-grounding-fallback.mjs
      - run: node tools/check-ask-causal-specificity-precedence.mjs
