name: Validate browser-native source graph

on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - '.github/workflows/raw-esm-guard.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - '.github/workflows/raw-esm-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject CSS imported as JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.js' -E "^[[:space:]]*import[[:space:]]+['\"][^'\"]+\.css['\"]" src; then
            echo 'Browser-native source graph contains CSS module imports in JavaScript.' >&2
            exit 1
          fi
      - name: Validate JavaScript syntax
        shell: bash
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify raw bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "./src/main.js" index.html
          grep -q "./app.js" src/main.js
          grep -q "../core/workbench-secondary.css" src/styles/index.css
          grep -q "../core/mobile-touch-targets.css" src/styles/index.css
