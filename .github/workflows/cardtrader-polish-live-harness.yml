name: Temporary CardTrader polish validation harness

on:
  pull_request:
    branches: [main]
    paths:
      - cloud-worker/cardtrader-web-links-refresh.mjs
      - src/modules/sealed/cardtrader-links.js
      - src/modules/admin/cardtrader-health.js
      - .github/workflows/cardtrader-sealed-refresh.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/cardtrader-polish-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CARDTRADER_JWT_TOKEN: ${{ secrets.CARDTRADER_JWT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cardtrader-polish-batch
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate CardTrader polish modules
        run: node --check cloud-worker/cardtrader-web-links-refresh.mjs && node --check src/modules/sealed/cardtrader-links.js && node --check src/modules/admin/cardtrader-health.js
      - name: Backfill canonical CardTrader links
        run: node cloud-worker/cardtrader-web-links-refresh.mjs
