name: Collectish YouTube Signals refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/signals-youtube-sync.yml"
      - "supabase/functions/market-intel-youtube-sync/**"
      - "supabase/functions/market-intel-video-event-extract/**"
      - "supabase/functions/market-intel-video-product-event-extract/**"
      - "supabase/functions/market-intel-ingest/index.ts"
      - "supabase/functions/market-intel-analyze/index.ts"

permissions:
  contents: read

concurrency:
  group: collectish-youtube-signals-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_FUNCTION_URL: https://bnsnlikjeogzdubgyvxk.supabase.co/functions/v1/market-intel-youtube-sync
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Refresh up to two native-captioned creator videos
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          response_file="$(mktemp)"
          status="$({ curl --silent --show-error \
            --max-time 165 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{"max_transcripts":2,"backfill_days":60}' \
            "$SUPABASE_FUNCTION_URL"; } || true)"
          cat "$response_file"
          echo
          if [[ ! "$status" =~ ^2 ]]; then
            echo "YouTube Signals refresh failed with HTTP $status" >&2
            exit 1
          fi
          policy_mode="$(jq -r '.policy.transcript_mode // "unknown"' "$response_file")"
          ai_generation="$(jq -r 'if .policy.ai_generation == null then true else .policy.ai_generation end' "$response_file")"
          attempted="$(jq -r '.transcript_attempts // 0' "$response_file")"
          billable="$(jq -r '.billable_credits_observed // 0' "$response_file")"
          events_saved="$(jq -r '.events_saved // 0' "$response_file")"
          card_events_saved="$(jq -r '.card_events_saved // 0' "$response_file")"
          product_events_saved="$(jq -r '.product_events_saved // 0' "$response_file")"
          source_failures="$(jq -r '.failed // 0' "$response_file")"
          diagnostics="$(jq -c '.diagnostics // {}' "$response_file")"
          echo "mode=$policy_mode ai_generation=$ai_generation attempted=$attempted observed_billable=$billable events_saved=$events_saved card_events_saved=$card_events_saved product_events_saved=$product_events_saved source_failures=$source_failures diagnostics=$diagnostics"
          test "$policy_mode" = "native"
          test "$ai_generation" = "false"
          test "$attempted" -le 2
          if (( source_failures > 0 )); then
            echo "YouTube discovery completed with $source_failures transient source failure(s); no policy violation occurred." >&2
          fi
