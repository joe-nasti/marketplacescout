name: Refresh Scout rankings

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: read

concurrency:
  group: collectish-scout-rankings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCOUT_RANKINGS_STALE_MINUTES: "105"
      SCOUT_FORCE_FULL: "1"
      SCOUT_RANKINGS_SOURCE: "hourly_reconciliation"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require service role key
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Validate workers
        run: node --check cloud-worker/refresh-scout-rankings.mjs cloud-worker/watch-scout-rankings.mjs
      - name: Refresh Scout aggregation, v5 score, and cache
        id: refresh
        continue-on-error: true
        run: node cloud-worker/refresh-scout-rankings.mjs
      - name: Verify freshness and recover once if needed
        if: always()
        run: node cloud-worker/watch-scout-rankings.mjs
