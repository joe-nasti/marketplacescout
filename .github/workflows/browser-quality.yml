name: Browser quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/browser/**'
      - 'tools/playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/browser-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/browser/**'
      - 'tools/playwright.config.mjs'
      - 'package.json'
      - 'cloud-worker/retag-recent-signals.mjs'
      - 'supabase/functions/market-intel-card-tag/**'
      - '.github/workflows/browser-quality.yml'

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run test:browser
      - name: One-shot precise Signals retag backfill
        if: github.event_name == 'push' && github.event.head_commit.message == 'Run precise Signals retag backfill'
        env:
          SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SIGNALS_RETAG_DAYS: '14'
          SIGNALS_RETAG_LIMIT: '40'
          SIGNALS_RETAG_CONCURRENCY: '2'
        run: node cloud-worker/retag-recent-signals.mjs
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
