name: Collectish vendor depth sync

on:
  workflow_dispatch:
    inputs:
      source:
        description: Vendor source
        required: true
        default: cardkingdom
        type: choice
        options: [cardkingdom]
  schedule:
    # Full CK catalog is intentionally much slower-moving than TCGplayer/ManaPool.
    # Refresh twice daily; Ask reuses the latest stored catalog observation.
    - cron: "35 11,23 * * *"
  push:
    paths:
      - "cloud-worker/vendor-depth-lib.mjs"
      - "cloud-worker/cardkingdom-depth-sync.mjs"
      - "tools/check-vendor-depth-contract.mjs"
      - ".github/workflows/vendor-depth-sync.yml"

permissions:
  contents: read

concurrency:
  group: collectish-vendor-depth-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node --check cloud-worker/vendor-depth-lib.mjs cloud-worker/cardkingdom-depth-sync.mjs
      - run: node tools/check-vendor-depth-contract.mjs

  sync:
    # A main-branch change to this pipeline is also a deployment smoke test.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Sync Card Kingdom exact supply and demand
        if: github.event_name == 'schedule' || inputs.source == 'cardkingdom'
        run: node cloud-worker/cardkingdom-depth-sync.mjs
