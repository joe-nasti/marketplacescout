name: Patch Delvin mobile hierarchy
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/patch-delvin-mobile-hierarchy.mjs'
      - '.github/workflows/patch-delvin-mobile-hierarchy.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/patch-delvin-mobile-hierarchy.mjs
      - name: Commit hierarchy cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/ask-collectish-delvin-supply-present/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Tighten Delvin opportunity hierarchy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
