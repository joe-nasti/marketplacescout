name: Collectish sealed TCGCSV history backfill

on:
  workflow_dispatch:
    inputs:
      max_archives:
        description: Maximum archive dates to import in this run
        required: false
        default: "12"
      stride_days:
        description: Historical sampling interval in days
        required: false
        default: "7"
  schedule:
    # Run frequently while the finite weekly archive backlog is being filled.
    # Once complete, the importer exits without rewriting completed dates.
    - cron: "15 * * * *"
  push:
    branches: [main]
    paths:
      - "cloud-worker/tcgcsv-sealed-history-backfill.mjs"
      - "supabase/migrations/*modeled_booster_card_history.sql"
      - ".github/workflows/tcgcsv-sealed-history-backfill.yml"

permissions:
  contents: read

concurrency:
  group: collectish-tcgcsv-sealed-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TCGCSV_BASE_URL: https://tcgcsv.com
      TCGCSV_HISTORY_MAX_ARCHIVES: ${{ inputs.max_archives || '12' }}
      TCGCSV_HISTORY_STRIDE_DAYS: ${{ inputs.stride_days || '7' }}
      TCGCSV_HISTORY_START: "2024-02-08"
      TCGCSV_USER_AGENT: "Collectish-MarketplaceScout/1.0 (+https://github.com/joe-nasti/marketplacescout)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install archive reader
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Validate importer
        run: node --check cloud-worker/tcgcsv-sealed-history-backfill.mjs
      - name: Import compact sealed and modeled-card history
        run: node cloud-worker/tcgcsv-sealed-history-backfill.mjs
