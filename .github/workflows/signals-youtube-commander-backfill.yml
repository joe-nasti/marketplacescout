name: Collectish Commander video extraction

on:
  workflow_dispatch:
  schedule:
    - cron: "10 1,7,13,19 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/signals-youtube-commander-backfill.yml"
      - "supabase/functions/market-intel-video-commander-deterministic/**"
      - "supabase/functions/market-intel-video-speaker-enrichment/**"
      - "supabase/functions/market-intel-video-synergy-batch/**"
      - "supabase/functions/market-intel-synergy-scout-wake/**"
      - "supabase/functions/market-intel-future-card-thesis-refresh/**"

permissions:
  contents: read

concurrency:
  group: collectish-commander-video-extraction
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUNCTION_URL: https://bnsnlikjeogzdubgyvxk.supabase.co/functions/v1/market-intel-video-commander-deterministic
      SPEAKER_FUNCTION_URL: https://bnsnlikjeogzdubgyvxk.supabase.co/functions/v1/market-intel-video-speaker-enrichment
      SYNERGY_FUNCTION_URL: https://bnsnlikjeogzdubgyvxk.supabase.co/functions/v1/market-intel-video-synergy-batch
      SYNERGY_WAKE_FUNCTION_URL: https://bnsnlikjeogzdubgyvxk.supabase.co/functions/v1/market-intel-synergy-scout-wake
      FUTURE_THESIS_FUNCTION_URL: https://bnsnlikjeogzdubgyvxk.supabase.co/functions/v1/market-intel-future-card-thesis-refresh
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Extract one cached Commander video
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          response_file="$(mktemp)"
          status="$({ curl --silent --show-error --max-time 300 --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Content-Type: application/json" --data '{}' "$FUNCTION_URL"; } || true)"
          cat "$response_file"; echo
          [[ "$status" =~ ^2 ]] || exit 1
          credits="$(jq -r '.transcript_credits_used // 0' "$response_file")"
          echo "video=$(jq -r '.video_id // "none"' "$response_file") trigger_hits=$(jq -r '.trigger_hits // 0' "$response_file") events_saved=$(jq -r '.events_saved // 0' "$response_file") transcript_credits_used=$credits"
          test "$credits" = "0"

      - name: Regression - recover Command Zone 759 strong synergies
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$({ curl --silent --show-error --max-time 300 --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Content-Type: application/json" --data '{"video_id":"7XpHTfYG_X0","force":true}' "$SYNERGY_FUNCTION_URL"; } || true)"
          cat "$response_file"; echo
          [[ "$status" =~ ^2 ]] || exit 1
          test "$(jq -r '.transcript_credits_used // 0' "$response_file")" = "0"
          if [[ "$(jq -r '.processed // 0' "$response_file")" = "0" ]]; then
            echo "Cached regression fixture is not currently eligible; continuing production extraction."
            exit 0
          fi
          targets="$(jq -r '[.relationships[]?.target_card] | unique | join("|")' "$response_file")"
          echo "recovered_targets=$targets"
          for expected in "Training Grounds" "Outcaster Trailblazer" "Tasha's Hideous Laughter" "Extract"; do
            echo "$targets" | grep -Fq "$expected" || { echo "missing expected synergy target: $expected"; exit 1; }
          done
          echo "$targets" | grep -Fq "Hardened Academic" && { echo "false positive returned: Hardened Academic"; exit 1; } || true

      - name: Extract new-card to existing-card synergies
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$({ curl --silent --show-error --max-time 300 --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Content-Type: application/json" --data '{}' "$SYNERGY_FUNCTION_URL"; } || true)"
          cat "$response_file"; echo
          [[ "$status" =~ ^2 ]] || exit 1
          echo "relationships_saved=$(jq -r '.relationships_saved // 0' "$response_file") actionable=$(jq -r '.actionable_relationships // 0' "$response_file")"
          test "$(jq -r '.transcript_credits_used // 0' "$response_file")" = "0"

      - name: Wake Scout for strong synergy targets
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$({ curl --silent --show-error --max-time 120 --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Content-Type: application/json" --data '{"min_conviction":0.85,"limit":12,"cooldown_hours":6}' "$SYNERGY_WAKE_FUNCTION_URL"; } || true)"
          cat "$response_file"; echo
          [[ "$status" =~ ^2 ]] || exit 1
          echo "targets_woken=$(jq -r '.targets_woken // 0' "$response_file") skus_queued=$(jq -r '.skus_queued // 0' "$response_file") skipped_cooldown=$(jq -r '.skipped_cooldown // 0' "$response_file")"

      - name: Enrich speaker consensus from cached transcript
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$({ curl --silent --show-error --max-time 300 --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Content-Type: application/json" --data '{"video_limit":4}' "$SPEAKER_FUNCTION_URL"; } || true)"
          cat "$response_file"; echo
          [[ "$status" =~ ^2 ]] || exit 1
          echo "videos_processed=$(jq -r '.videos_processed // 0' "$response_file") events_updated=$(jq -r '.events_updated // 0' "$response_file")"

      - name: Preserve unreleased-card theses
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$({ curl --silent --show-error --max-time 300 --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Content-Type: application/json" --data '{"limit":60}' "$FUTURE_THESIS_FUNCTION_URL"; } || true)"
          cat "$response_file"; echo
          [[ "$status" =~ ^2 ]] || exit 1
          echo "future_cards_detected=$(jq -r '.future_cards_detected // 0' "$response_file") theses_refreshed=$(jq -r '.theses_refreshed // 0' "$response_file")"
