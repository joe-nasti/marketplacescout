name: Apply Delvin opportunity v3 surface
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply-delvin-opportunity-v3-surface.mjs'
      - '.github/workflows/apply-delvin-opportunity-v3-surface.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-delvin-opportunity-v3-surface.mjs
      - name: Commit patched presenter
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/ask-collectish-delvin-supply-present/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Wire demand and sourced pull odds into Delvin"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
