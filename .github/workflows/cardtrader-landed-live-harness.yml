name: Temporary CardTrader landed validation harness

on:
  pull_request:
    branches: [main]
    paths:
      - cloud-worker/cardtrader-landed-refresh.mjs
      - src/modules/sealed/cardtrader.js
      - .github/workflows/cardtrader-sealed-refresh.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/cardtrader-landed-cost'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CARDTRADER_SHIPPING_RESERVE_PER_UNIT_USD: "10"
      CARDTRADER_FUNDING_FEE_PCT: "0"
      CARDTRADER_FUNDING_FIXED_USD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate landed model and UI module
        run: node --check cloud-worker/cardtrader-landed-refresh.mjs && node --check src/modules/sealed/cardtrader.js
      - name: Run landed model against current CT observations
        run: node cloud-worker/cardtrader-landed-refresh.mjs
