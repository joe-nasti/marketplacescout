name: cEDH seed regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/signals-youtube-cedh-seed-regression.yml"

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_FUNCTION_URL: https://bnsnlikjeogzdubgyvxk.supabase.co/functions/v1/market-intel-video-cedh-reconcile
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Reconcile King T'Challa regression fixture
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$({ curl --silent --show-error \
            --max-time 300 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{"video_id":"Z0RBuhUyF4Q","limit":1}' \
            "$SUPABASE_FUNCTION_URL"; } || true)"
          cat "$response_file"
          echo
          [[ "$status" =~ ^2 ]]
          jq -e '.ok == true' "$response_file" >/dev/null
          jq -e '.results[0].video_id == "Z0RBuhUyF4Q"' "$response_file" >/dev/null
