name: Validate Collectish web

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'src/**'
      - 'tools/finalize-vite-build.mjs'
      - 'manifest.webmanifest'
      - 'collectish-icon-*.png'
      - '.github/workflows/vite-web-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLECTISH_WEB_REVISION: pr-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Enforce modular source tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) ! -name 'vite.config.js' -print)"
          test -z "$(find . -maxdepth 1 -type f \( -name 'current-*' -o -name 'v0*.js' -o -name 'v0*.css' \) -print)"
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install Vite
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Validate artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/.vite/manifest.json
          grep -Eq 'assets/[^" ]+[.-][A-Za-z0-9_-]+\.js' dist/index.html
          grep -Eq 'assets/[^" ]+[.-][A-Za-z0-9_-]+\.css' dist/index.html
          ! grep -Eq '(current-|v0[0-9]+\.(js|css))' dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: collectish-vite-dist
          path: dist
          if-no-files-found: error
