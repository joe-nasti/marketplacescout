name: Collectish Marketplace cloud worker

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: Maximum queued cloud Marketplace jobs to process per worker pass
        required: false
        default: "4"
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/marketplace-cloud-worker.yml"
      - "cloud-worker/marketplace-worker.mjs"
      - "cloud-worker/ask-investigate-worker.mjs"
      - "cloud-worker/queue-configured-set-refresh.mjs"
      - "cloud-worker/validate-claim-rpc.mjs"
      - "cloud-worker/normalize-marketplace-jobs.mjs"
      - "cloud-worker/recover-stale-jobs.mjs"
      - "cloud-worker/recover-marketplace-cloud-jobs.mjs"
      - "cloud-worker/enable-atomic-claim.mjs"
      - "cloud-worker/enrich-scout-scryfall.mjs"
      - "cloud-worker/refresh-scout-rankings.mjs"

permissions:
  contents: read
  statuses: write

concurrency:
  group: collectish-marketplace-cloud-worker-v2
  cancel-in-progress: false

jobs:
  marketplace-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTISH_MAX_JOBS: ${{ github.event.inputs.max_jobs || '4' }}
      COLLECTISH_SCRYFALL_BATCH: "40"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate worker secret
        id: secret
        continue-on-error: true
        shell: bash
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Publish Marketplace secret status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RESULT: ${{ steps.secret.outcome }}
        shell: bash
        run: |
          state=success; desc='Marketplace worker secret is available'
          if [ "$RESULT" != success ]; then state=failure; desc='Marketplace worker secret is missing'; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state="$state" -f context='collectish/marketplace-secret' -f description="$desc" -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Stop on missing Marketplace secret
        if: steps.secret.outcome != 'success'
        run: exit 1
      - name: Validate canonical cloud workers
        id: validation
        continue-on-error: true
        run: |
          node --check cloud-worker/queue-configured-set-refresh.mjs
          node --check cloud-worker/validate-claim-rpc.mjs
          node --check cloud-worker/normalize-marketplace-jobs.mjs
          node --check cloud-worker/recover-stale-jobs.mjs
          node --check cloud-worker/recover-marketplace-cloud-jobs.mjs
          node --check cloud-worker/enable-atomic-claim.mjs
          node --check cloud-worker/marketplace-worker.mjs
          node --check cloud-worker/ask-investigate-worker.mjs
          node --check cloud-worker/enrich-scout-scryfall.mjs
          node --check cloud-worker/refresh-scout-rankings.mjs
          grep -q 'Set filter mismatch' cloud-worker/marketplace-worker.mjs
          grep -q 'const setFilter=String(setName||setSlug' cloud-worker/marketplace-worker.mjs
          grep -q 'setName:\[setFilter\]' cloud-worker/marketplace-worker.mjs
          test ! -e tools/patch-marketplace-set-filter.py
          test ! -e tools/patch-ask-collectish-investigate.py
          test ! -e cloud-worker/requeue-failed-to-pc.mjs
          ! grep -RqsE '(^|[[:space:]])(python|node)[[:space:]]+(tools/patch-marketplace-set-filter\.py|tools/patch-ask-collectish-investigate\.py|cloud-worker/requeue-failed-to-pc\.mjs)' .github/workflows
      - name: Publish Marketplace validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RESULT: ${{ steps.validation.outcome }}
        shell: bash
        run: |
          state=success; desc='Canonical Marketplace worker validation passed'
          if [ "$RESULT" != success ]; then state=failure; desc='Canonical Marketplace worker validation failed'; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state="$state" -f context='collectish/marketplace-validation' -f description="$desc" -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Stop on Marketplace validation failure
        if: steps.validation.outcome != 'success'
        run: exit 1
      - name: Drain existing canonical Marketplace queue
        id: drain
        continue-on-error: true
        run: node cloud-worker/marketplace-worker.mjs
      - name: Publish Marketplace drain status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RESULT: ${{ steps.drain.outcome }}
        shell: bash
        run: |
          state=success; desc='Marketplace worker reached first queue-drain pass'
          if [ "$RESULT" != success ]; then state=failure; desc='Marketplace first queue-drain pass failed'; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state="$state" -f context='collectish/marketplace-drain' -f description="$desc" -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Stop on Marketplace drain failure
        if: steps.drain.outcome != 'success'
        run: exit 1
      - name: Queue configured set scans
        run: node cloud-worker/queue-configured-set-refresh.mjs
      - name: Validate atomic claim RPC
        run: node cloud-worker/validate-claim-rpc.mjs
      - name: Normalize Marketplace executor capabilities
        run: node cloud-worker/normalize-marketplace-jobs.mjs
      - name: Recover expired Marketplace leases
        run: node cloud-worker/recover-stale-jobs.mjs
      - name: Recover and deduplicate cloud retries
        run: node cloud-worker/recover-marketplace-cloud-jobs.mjs
      - name: Final cloud routing normalization
        run: node cloud-worker/normalize-marketplace-jobs.mjs
      - name: Enable atomic job claim
        run: node cloud-worker/enable-atomic-claim.mjs
      - name: Run Ask Collectish Investigate jobs
        run: node cloud-worker/ask-investigate-worker.mjs
      - name: Run newly admitted or recovered Marketplace jobs
        run: node cloud-worker/marketplace-worker.mjs
      - name: Enrich Scout card metadata
        if: always()
        continue-on-error: true
        run: node cloud-worker/enrich-scout-scryfall.mjs
      - name: Refresh promoted Scout v5 rankings
        if: always()
        continue-on-error: true
        run: node cloud-worker/refresh-scout-rankings.mjs
      - name: Recover failed cloud jobs with deferred retries
        if: always()
        run: node cloud-worker/recover-marketplace-cloud-jobs.mjs
