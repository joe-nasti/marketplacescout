name: Collectish Marketplace cloud worker

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: Maximum queued cloud Marketplace jobs to process
        required: false
        default: "4"
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/marketplace-cloud-worker.yml"
      - "cloud-worker/marketplace-worker.mjs"
      - "cloud-worker/ask-investigate-worker.mjs"
      - "cloud-worker/queue-configured-set-refresh.mjs"
      - "cloud-worker/validate-claim-rpc.mjs"
      - "cloud-worker/normalize-marketplace-jobs.mjs"
      - "cloud-worker/recover-stale-jobs.mjs"
      - "cloud-worker/requeue-failed-to-pc.mjs"
      - "cloud-worker/enable-atomic-claim.mjs"
      - "cloud-worker/enrich-scout-scryfall.mjs"
      - "cloud-worker/refresh-scout-rankings.mjs"

permissions:
  contents: read

concurrency:
  group: collectish-marketplace-cloud-worker
  cancel-in-progress: false

jobs:
  marketplace-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTISH_MAX_JOBS: ${{ github.event.inputs.max_jobs || '4' }}
      COLLECTISH_SCRYFALL_BATCH: "40"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate worker secret
        shell: bash
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Validate canonical cloud workers
        run: |
          node --check cloud-worker/queue-configured-set-refresh.mjs
          node --check cloud-worker/validate-claim-rpc.mjs
          node --check cloud-worker/normalize-marketplace-jobs.mjs
          node --check cloud-worker/recover-stale-jobs.mjs
          node --check cloud-worker/requeue-failed-to-pc.mjs
          node --check cloud-worker/enable-atomic-claim.mjs
          node --check cloud-worker/marketplace-worker.mjs
          node --check cloud-worker/ask-investigate-worker.mjs
          node --check cloud-worker/enrich-scout-scryfall.mjs
          node --check cloud-worker/refresh-scout-rankings.mjs
          grep -q 'Set filter mismatch' cloud-worker/marketplace-worker.mjs
          grep -q 'setName:profile.setName' cloud-worker/marketplace-worker.mjs || grep -q 'setName=profile.setName' cloud-worker/marketplace-worker.mjs
          ! grep -Rqs 'patch-marketplace-set-filter\|patch-ask-collectish-investigate' .github/workflows cloud-worker
      - name: Queue configured set scans
        run: node cloud-worker/queue-configured-set-refresh.mjs
      - name: Validate atomic claim RPC
        run: node cloud-worker/validate-claim-rpc.mjs
      - name: Normalize Marketplace executor capabilities
        run: node cloud-worker/normalize-marketplace-jobs.mjs
      - name: Recover expired Marketplace leases
        run: node cloud-worker/recover-stale-jobs.mjs
      - name: Recover and deduplicate cloud retries
        run: node cloud-worker/requeue-failed-to-pc.mjs
      - name: Final cloud routing normalization
        run: node cloud-worker/normalize-marketplace-jobs.mjs
      - name: Enable atomic job claim
        run: node cloud-worker/enable-atomic-claim.mjs
      - name: Run Ask Collectish Investigate jobs
        run: node cloud-worker/ask-investigate-worker.mjs
      - name: Run cloud-targeted Marketplace jobs
        run: node cloud-worker/marketplace-worker.mjs
      - name: Enrich Scout card metadata
        if: always()
        continue-on-error: true
        run: node cloud-worker/enrich-scout-scryfall.mjs
      - name: Refresh promoted Scout v5 rankings
        if: always()
        continue-on-error: true
        run: node cloud-worker/refresh-scout-rankings.mjs
      - name: Recover failed cloud jobs with deferred retries
        if: always()
        run: node cloud-worker/requeue-failed-to-pc.mjs
