name: Collectish Marketplace cloud worker

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: Maximum queued cloud Marketplace jobs to process
        required: false
        default: "4"
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/marketplace-cloud-worker.yml"
      - "cloud-worker/**"
      - "tools/patch-marketplace-set-filter.py"
      - "tools/patch-ask-collectish-investigate.py"

permissions:
  contents: read

concurrency:
  group: collectish-marketplace-cloud-worker
  cancel-in-progress: false

jobs:
  marketplace-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTISH_MAX_JOBS: ${{ github.event.inputs.max_jobs || '4' }}
      COLLECTISH_SCRYFALL_BATCH: "40"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate worker secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing repository secret SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi
      - name: Queue configured set scans
        run: node cloud-worker/queue-configured-set-refresh.mjs
      - name: Validate atomic claim RPC
        run: node cloud-worker/validate-claim-rpc.mjs
      - name: Normalize Marketplace executor capabilities
        run: node cloud-worker/normalize-marketplace-jobs.mjs
      - name: Recover expired Marketplace leases
        run: node cloud-worker/recover-stale-jobs.mjs
      - name: Re-normalize recovered jobs
        run: node cloud-worker/normalize-marketplace-jobs.mjs
      - name: Deduplicate and defer cloud-only retries before claim
        run: node cloud-worker/requeue-failed-to-pc.mjs
      - name: Final cloud-only routing normalization
        run: node cloud-worker/normalize-marketplace-jobs.mjs
      - name: Prepare cloud worker identity
        shell: bash
        run: |
          sed -i 's/const WORKER_ID="cloud-marketplace-worker"/const WORKER_ID="00000000-0000-4000-8000-000000000001"/' cloud-worker/marketplace-worker.mjs
          sed -i 's/const WORKER_ID="cloud-marketplace-worker"/const WORKER_ID="00000000-0000-4000-8000-000000000001"/' cloud-worker/parity-check.mjs
      - name: Harden TCGplayer set filter
        run: python tools/patch-marketplace-set-filter.py
      - name: Harden scan-row persistence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cloud-worker/marketplace-worker.mjs')
          s = p.read_text()
          old = 'for(let i=0;i<rr.length;i+=200)await sb("marketplace_scan_rows?on_conflict=user_id,scan_id,sku_id",{method:"POST",body:rr.slice(i,i+200),prefer:"resolution=merge-duplicates,return=minimal"})'
          new = 'try{for(let i=0;i<rr.length;i+=25)await sb("marketplace_scan_rows?on_conflict=user_id,scan_id,sku_id",{method:"POST",body:rr.slice(i,i+25),prefer:"resolution=merge-duplicates,return=minimal"})}catch(e){try{await sb(`marketplace_scan_rows?user_id=eq.${encodeURIComponent(job.user_id)}&scan_id=eq.${encodeURIComponent(scan.scanId)}`,{method:"DELETE",prefer:"return=minimal"})}catch{}try{await sb(`marketplace_scans?user_id=eq.${encodeURIComponent(job.user_id)}&scan_id=eq.${encodeURIComponent(scan.scanId)}`,{method:"DELETE",prefer:"return=minimal"})}catch{}throw e}'
          if old not in s:
              raise SystemExit('Expected Marketplace persistence batch code was not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Enable Ask Collectish Investigate jobs
        run: python tools/patch-ask-collectish-investigate.py
      - name: Enable atomic job claim
        run: node cloud-worker/enable-atomic-claim.mjs
      - name: Validate patched worker
        run: |
          python -m py_compile tools/patch-marketplace-set-filter.py tools/patch-ask-collectish-investigate.py
          node --check cloud-worker/queue-configured-set-refresh.mjs
          node --check cloud-worker/marketplace-worker.mjs
          node --check cloud-worker/enrich-scout-scryfall.mjs
          node --check cloud-worker/rescore-new-scout-v4.mjs
          grep -q 'Set filter mismatch' cloud-worker/marketplace-worker.mjs
          grep -q 'setName:profile.setName' cloud-worker/marketplace-worker.mjs
          grep -q 'runScoutSalesEnrich' cloud-worker/marketplace-worker.mjs
          grep -q 'source=eq.ask_collectish' cloud-worker/marketplace-worker.mjs
          grep -q 'recalculate_scout_base_v4_batch' cloud-worker/rescore-new-scout-v4.mjs
      - name: Capture Scout row watermark
        run: node cloud-worker/rescore-new-scout-v4.mjs capture
      - name: Run cloud-targeted Marketplace jobs
        run: node cloud-worker/marketplace-worker.mjs
      - name: Canonically score newly inserted Marketplace rows
        run: node cloud-worker/rescore-new-scout-v4.mjs rescore
      - name: Enrich Scout card metadata
        if: always()
        continue-on-error: true
        run: node cloud-worker/enrich-scout-scryfall.mjs
      - name: Recover failed cloud jobs with deferred retries
        if: always()
        run: node cloud-worker/requeue-failed-to-pc.mjs
      - name: Compare any completed manual verification pair
        if: always()
        continue-on-error: true
        run: node cloud-worker/parity-check.mjs
      - name: Finalize linked manual pair when both scans exist
        if: always()
        run: node cloud-worker/finalize-linked-pair.mjs
