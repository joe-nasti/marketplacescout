name: Collectish Marketplace cloud worker

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: Maximum queued cloud verification jobs to process
        required: false
        default: "1"
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - ".github/workflows/marketplace-cloud-worker.yml"
      - "cloud-worker/**"

permissions:
  contents: read

concurrency:
  group: collectish-marketplace-cloud-worker
  cancel-in-progress: false

jobs:
  marketplace-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTISH_MAX_JOBS: ${{ github.event.inputs.max_jobs || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate worker secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing repository secret SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi
      - name: Prepare cloud worker identity
        shell: bash
        run: |
          sed -i 's/const WORKER_ID="cloud-marketplace-worker"/const WORKER_ID="00000000-0000-4000-8000-000000000001"/' cloud-worker/marketplace-worker.mjs
          sed -i 's/const WORKER_ID="cloud-marketplace-worker"/const WORKER_ID="00000000-0000-4000-8000-000000000001"/' cloud-worker/parity-check.mjs
      - name: Ensure paired verification
        run: node cloud-worker/ensure-paired-verification.mjs
      - name: Run cloud-targeted Marketplace job
        run: node cloud-worker/marketplace-worker.mjs
      - name: Compare cloud result with paired PC baseline
        run: node cloud-worker/parity-check.mjs
