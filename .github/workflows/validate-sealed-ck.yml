name: Validate Scout Sealed CK

on:
  workflow_dispatch:
  push:
    paths:
      - "cloud-worker/refresh-sealed-cardkingdom-prices.mjs"
      - ".github/workflows/validate-sealed-ck.yml"

permissions:
  contents: read

jobs:
  validate-ck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PRECON_RELEASE_FROM: "2025-01-01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check cloud-worker/refresh-sealed-cardkingdom-prices.mjs
      - run: node cloud-worker/refresh-sealed-cardkingdom-prices.mjs
