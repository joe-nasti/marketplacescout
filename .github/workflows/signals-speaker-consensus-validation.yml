name: Collectish speaker consensus validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/market-intel-relationship-speaker-consensus/**"
      - ".github/workflows/signals-speaker-consensus-validation.yml"

permissions:
  contents: read

concurrency:
  group: collectish-speaker-consensus-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CONSENSUS_URL: https://bnsnlikjeogzdubgyvxk.supabase.co/functions/v1/market-intel-relationship-speaker-consensus
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Command Zone 759 consensus + Extra Turns benchmark
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 420 --output "$response_file" --write-out '%{http_code}' --request POST \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{"video_id":"7XpHTfYG_X0","limit":24,"benchmark_video_id":"9RCIT4xTn-w"}' "$CONSENSUS_URL")"
          cat "$response_file"; echo
          [[ "$status" =~ ^2 ]]
          test "$(jq -r '.transcript_credits_used // 0' "$response_file")" = "0"
          test "$(jq -r '.relationships_refreshed // 0' "$response_file")" -ge 4
          test "$(jq -r '.benchmark.speaker_count // 0' "$response_file")" -ge 3
          jq -e '.results | any(.target_card == "Training Grounds")' "$response_file" >/dev/null
          jq -e '.results | any(.target_card == "Tasha'"'"'s Hideous Laughter")' "$response_file" >/dev/null
          jq -e '.results | any(.target_card == "Outcaster Trailblazer")' "$response_file" >/dev/null
          jq -e '[.results[] | select(.consensus_bonus > 0)] | length >= 1' "$response_file" >/dev/null
