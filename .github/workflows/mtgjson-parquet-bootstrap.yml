name: Collectish MTGJSON Parquet bootstrap

on:
  push:
    paths:
      - ".github/workflows/mtgjson-parquet-bootstrap.yml"
      - "cloud-worker/mtgjson-parquet-sync.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collectish-mtgjson-parquet-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MTGJSON_PARQUET_BASE_URL: https://mtgjson.com/api/v5/parquet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: python -m py_compile cloud-worker/mtgjson-parquet-sync.py
      - name: Install PyArrow
        run: python -m pip install --disable-pip-version-check pyarrow==18.1.0
      - name: Require service role key
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Import normalized MTGJSON catalog
        run: python cloud-worker/mtgjson-parquet-sync.py
