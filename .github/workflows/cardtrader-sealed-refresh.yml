name: CardTrader sealed refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: collectish-cardtrader-sealed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CARDTRADER_JWT_TOKEN: ${{ secrets.CARDTRADER_JWT_TOKEN }}
      CARDTRADER_CATALOG_STALE_HOURS: "24"
      CARDTRADER_REQUEST_INTERVAL_MS: "1050"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require server secrets
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY" && test -n "$CARDTRADER_JWT_TOKEN"
      - name: Validate CardTrader workers
        run: node --check cloud-worker/cardtrader-sealed-map-refresh.mjs && node --check cloud-worker/cardtrader-sealed-refresh.mjs
      - name: Refresh existing exact CardTrader mappings
        run: node cloud-worker/cardtrader-sealed-map-refresh.mjs
      - name: Refresh CardTrader / CardTrader Zero sealed market
        run: node cloud-worker/cardtrader-sealed-refresh.mjs
      - name: Reconcile mappings after any catalog refresh
        run: node cloud-worker/cardtrader-sealed-map-refresh.mjs
      - name: Archive sealed price observations
        if: always()
        run: node cloud-worker/archive-sealed-price-current.mjs
