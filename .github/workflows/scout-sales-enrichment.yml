name: Collectish shared Marketplace sales history

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum product history calls this run
        required: false
        default: "250"
  schedule:
    - cron: "5 */3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/scout-sales-enrichment.yml"
      - "cloud-worker/marketplace-sales-history.mjs"
      - "cloud-worker/scout-sales-enrichment.mjs"
      - "supabase/migrations/*marketplace_sales_candidate*.sql"

permissions:
  contents: read

concurrency:
  group: collectish-marketplace-sales-history
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTISH_MARKETPLACE_SALES_LIMIT: ${{ github.event.inputs.limit || '250' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate shared worker
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          node --check cloud-worker/marketplace-sales-history.mjs
          node --check cloud-worker/scout-sales-enrichment.mjs
          grep -q "get_marketplace_sales_collection_candidates" cloud-worker/marketplace-sales-history.mjs
          grep -q "apply_marketplace_sales_history" cloud-worker/marketplace-sales-history.mjs
          grep -q "refresh_scout_v5_shadow" cloud-worker/marketplace-sales-history.mjs
      - name: Collect shared TCGplayer sales history
        run: node cloud-worker/marketplace-sales-history.mjs
