name: Collectish EDHREC cloud context

on:
  workflow_dispatch:
  schedule:
    - cron: "37 10 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/edhrec-cloud-worker.yml"
      - "cloud-worker/edhrec-worker.mjs"
      - "cloud-worker/recalculate-scout-edhrec.mjs"
      - "cloud-worker/refresh-scout-24h.mjs"

permissions:
  contents: read

concurrency:
  group: collectish-edhrec-cloud
  cancel-in-progress: false

jobs:
  edhrec:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTISH_EDHREC_RECENT_SETS: "8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate workers
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          node --check cloud-worker/edhrec-worker.mjs
          node --check cloud-worker/recalculate-scout-edhrec.mjs
          node --check cloud-worker/refresh-scout-24h.mjs
      - name: Collect EDHREC demand context
        run: node cloud-worker/edhrec-worker.mjs
      - name: Fold demand movement into Scout scores
        run: node cloud-worker/recalculate-scout-edhrec.mjs
      - name: Refresh 24-hour Scout snapshot
        run: node cloud-worker/refresh-scout-24h.mjs
