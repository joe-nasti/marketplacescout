name: Build signed Collectish Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android-agent/**"
      - ".github/workflows/build-android-signed.yml"

permissions:
  contents: write
  statuses: write

concurrency:
  group: collectish-android-signed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COLLECTISH_ANDROID_KEYSTORE_B64: ${{ secrets.COLLECTISH_ANDROID_KEYSTORE_B64 }}
      COLLECTISH_KEYSTORE_PASSWORD: ${{ secrets.COLLECTISH_ANDROID_KEYSTORE_PASSWORD }}
      COLLECTISH_KEY_ALIAS: ${{ secrets.COLLECTISH_ANDROID_KEY_ALIAS }}
      COLLECTISH_KEY_PASSWORD: ${{ secrets.COLLECTISH_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Read canonical Android version
        working-directory: android-agent
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=android-v$version_name" >> "$GITHUB_ENV"
          echo "RELEASE_APK=collectish-android-v$version_name.apk" >> "$GITHUB_ENV"

      - name: Require persistent signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COLLECTISH_ANDROID_KEYSTORE_B64"
          test -n "$COLLECTISH_KEYSTORE_PASSWORD"
          test -n "$COLLECTISH_KEY_ALIAS"
          test -n "$COLLECTISH_KEY_PASSWORD"

      - name: Restore and verify existing Collectish signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$COLLECTISH_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/collectish-release.jks"
          test -s "$RUNNER_TEMP/collectish-release.jks"
          echo "COLLECTISH_KEYSTORE_FILE=$RUNNER_TEMP/collectish-release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/collectish-release.jks" -storepass "$COLLECTISH_KEYSTORE_PASSWORD" -alias "$COLLECTISH_KEY_ALIAS" >/dev/null

      - name: Validate canonical Android source
        working-directory: android-agent
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "private val version = \"$ANDROID_VERSION_NAME\"" app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -Fq "versionCode = $ANDROID_VERSION_CODE" app/build.gradle.kts
          grep -Fq "versionName = \"$ANDROID_VERSION_NAME\"" app/build.gradle.kts
          grep -q '/admin/product/searchcatalog' app/src/main/java/com/collectish/agent/ReadOnlyProbePolicy.kt
          grep -q '/admin/product/updateinstockquantities' app/src/main/java/com/collectish/agent/ReadOnlyProbePolicy.kt
          grep -q 'fetch_html' app/src/main/java/com/collectish/agent/ReadOnlyProbeBridge.kt
          grep -q 'loginByUrl' app/src/main/java/com/collectish/agent/ReadOnlyProbeBridge.kt
          grep -q 'loginByBody' app/src/main/java/com/collectish/agent/ReadOnlyProbeBridge.kt
          grep -q 'text = "← Collectish"' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'sellerReturn.visibility=View.VISIBLE' app/src/main/java/com/collectish/agent/MainActivity.kt
          ! grep -q 'sessionState() != "authenticated"' app/src/main/java/com/collectish/agent/ReadOnlyProbeBridge.kt

      - name: Build persistently signed release APK
        working-directory: android-agent
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$RELEASE_APK"

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/$RELEASE_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/$RELEASE_APK" | grep -Fq "package: name='com.collectish.agent' versionCode='$ANDROID_VERSION_CODE' versionName='$ANDROID_VERSION_NAME'"

      - uses: actions/upload-artifact@v4
        with:
          name: collectish-android-signed
          path: ${{ runner.temp }}/${{ env.RELEASE_APK }}

      - name: Publish stable GitHub Release APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$RELEASE_APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$RELEASE_APK" --title "Collectish Android $ANDROID_VERSION_NAME" --notes "Signed Collectish Android $ANDROID_VERSION_NAME built directly from canonical Android source."
          fi

      - name: Publish signed Android status
        if: always()
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}', RESULT: '${{ job.status }}' }
        run: |
          state=success; desc="Signed Android $ANDROID_VERSION_NAME built from canonical source"
          if [ "$RESULT" != success ]; then state=failure; desc="Canonical Android $ANDROID_VERSION_NAME signed build failed"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state="$state" -f context='collectish/android-signed' -f description="$desc"
