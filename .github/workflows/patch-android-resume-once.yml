name: Patch Android resume state once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-android-resume-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist and restore last Android page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android-agent/app/src/main/java/com/collectish/agent/MainActivity.kt')
          s = p.read_text()

          old = 'if (accessToken.isNullOrBlank()) showLogin() else showPage("scout")'
          new = 'if (accessToken.isNullOrBlank()) showLogin() else showPage(currentPage)'
          if old not in s:
              raise SystemExit('startup Scout fallback pattern not found')
          s = s.replace(old, new, 1)

          old = '''        accountEmail = p.getString("email", null)\n    }'''
          new = '''        accountEmail = p.getString("email", null)\n        currentPage = p.getString("lastPage", "scout")?.takeIf { it in setOf("scout", "seller", "syp", "admin") } ?: "scout"\n    }'''
          if old not in s:
              raise SystemExit('restoreSession pattern not found')
          s = s.replace(old, new, 1)

          old = '''    private fun showPage(page: String) {\n        if (accessToken.isNullOrBlank()) { showLogin(); return }\n        seller.visibility = View.GONE\n        nativeShell.visibility = View.VISIBLE\n        nav.visibility = View.VISIBLE\n        currentPage = page; updateNav()\n        when (page) {'''
          new = '''    private fun showPage(page: String) {\n        if (accessToken.isNullOrBlank()) { showLogin(); return }\n        val targetPage = page.takeIf { it in setOf("scout", "seller", "syp", "admin") } ?: "scout"\n        seller.visibility = View.GONE\n        nativeShell.visibility = View.VISIBLE\n        nav.visibility = View.VISIBLE\n        currentPage = targetPage\n        getSharedPreferences("collectish-native", MODE_PRIVATE).edit().putString("lastPage", targetPage).apply()\n        updateNav()\n        when (targetPage) {'''
          if old not in s:
              raise SystemExit('showPage pattern not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Validate patch
        run: |
          grep -F 'showPage(currentPage)' android-agent/app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -F 'putString("lastPage", targetPage)' android-agent/app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -F 'p.getString("lastPage", "scout")' android-agent/app/src/main/java/com/collectish/agent/MainActivity.kt
      - name: Commit direct lifecycle fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-agent/app/src/main/java/com/collectish/agent/MainActivity.kt
          git rm .github/workflows/patch-android-resume-once.yml
          git commit -m "Preserve Android page across recreation"
          git push
