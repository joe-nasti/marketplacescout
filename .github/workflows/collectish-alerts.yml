name: Collectish alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "cloud-worker/collectish-alerts.mjs"
      - "cloud-worker/seller-orchestrator-watchdog.mjs"
      - "cloud-worker/watch-scout-rankings.mjs"
      - "cloud-worker/pipeline-freshness-audit.mjs"
      - ".github/workflows/collectish-alerts.yml"
  pull_request:
    paths:
      - "cloud-worker/collectish-alerts.mjs"
      - "cloud-worker/seller-orchestrator-watchdog.mjs"
      - "cloud-worker/watch-scout-rankings.mjs"
      - "cloud-worker/pipeline-freshness-audit.mjs"
      - ".github/workflows/collectish-alerts.yml"

permissions:
  contents: read

concurrency:
  group: collectish-alerts-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCOUT_RANKINGS_STALE_MINUTES: "75"
      TCGCSV_STALE_MINUTES: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate alert workers
        run: |
          node --check cloud-worker/collectish-alerts.mjs
          node --check cloud-worker/seller-orchestrator-watchdog.mjs
          node --check cloud-worker/watch-scout-rankings.mjs
          node --check cloud-worker/pipeline-freshness-audit.mjs
      - name: Validate alert secret
        if: github.event_name != 'pull_request'
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Evaluate Collectish alerts
        if: github.event_name != 'pull_request'
        run: node cloud-worker/collectish-alerts.mjs
      - name: Evaluate Seller orchestration backlog
        if: github.event_name != 'pull_request'
        run: node cloud-worker/seller-orchestrator-watchdog.mjs
      - name: Verify and recover Scout score freshness
        if: github.event_name != 'pull_request'
        run: node cloud-worker/watch-scout-rankings.mjs
      - name: Audit cross-pipeline source freshness
        if: github.event_name != 'pull_request'
        run: node cloud-worker/pipeline-freshness-audit.mjs
