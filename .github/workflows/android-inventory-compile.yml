name: Validate Collectish Android agent

on:
  workflow_dispatch:
  push:
    paths:
      - "android-agent/**"
      - ".github/workflows/android-inventory-compile.yml"
  pull_request:
    paths:
      - "android-agent/**"
      - ".github/workflows/android-inventory-compile.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: collectish-android-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify canonical authenticated-agent bridge
        working-directory: android-agent
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'versionCode = [0-9]+' app/build.gradle.kts
          grep -Eq 'versionName = "[^"]+"' app/build.gradle.kts
          grep -q '/admin/product/searchcatalog' app/src/main/java/com/collectish/agent/ReadOnlyProbePolicy.kt
          grep -q '/admin/product/updateinstockquantities' app/src/main/java/com/collectish/agent/ReadOnlyProbePolicy.kt
          grep -q 'path.startsWith("/admin/product/manage/")' app/src/main/java/com/collectish/agent/ReadOnlyProbePolicy.kt
          grep -q 'fetch_html' app/src/main/java/com/collectish/agent/ReadOnlyProbeBridge.kt
          grep -q 'TCGplayer Store session is not authenticated' app/src/main/java/com/collectish/agent/ReadOnlyProbeBridge.kt
          grep -q 'loginByUrl' app/src/main/java/com/collectish/agent/ReadOnlyProbeBridge.kt
          grep -q 'loginByBody' app/src/main/java/com/collectish/agent/ReadOnlyProbeBridge.kt
          ! grep -q 'sessionState() != "authenticated"' app/src/main/java/com/collectish/agent/ReadOnlyProbeBridge.kt
          grep -q 'text = "← Collectish"' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'sellerReturn.visibility=View.VISIBLE' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'settings.cacheMode = android.webkit.WebSettings.LOAD_DEFAULT' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'runHostedBootDiagnostic(view)' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'agentWeb.saveState(outState)' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'agentWeb.restoreState(savedInstanceState)' app/src/main/java/com/collectish/agent/MainActivity.kt
          ! grep -q "dispatchEvent(new Event('pageshow'))" app/src/main/java/com/collectish/agent/MainActivity.kt

      - name: Compile Android debug APK
        working-directory: android-agent
        run: gradle :app:assembleDebug

      - name: Publish Android validation status
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          state=success; desc='Canonical Android authenticated-agent source compiled'
          if [ "$RESULT" != success ]; then state=failure; desc='Canonical Android authenticated-agent validation failed'; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state="$state" -f context='collectish/android-agent-compile' -f description="$desc" -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
