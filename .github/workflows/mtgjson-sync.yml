name: Collectish MTGJSON sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: MTGJSON sync mode
        required: true
        default: prices
        type: choice
        options: [prices, identity, all]
  schedule:
    - cron: "15 11 * * *"
    - cron: "0 12 * * 0"
  push:
    paths:
      - "cloud-worker/mtgjson-sync.mjs"
      - "cloud-worker/mtgjson-parquet-sync.py"
      - "cloud-worker/mtgjson-set-sealed-sync.py"
      - "cloud-worker/mtgjson-native-booster-backtest.py"
      - "cloud-worker/mtgjson-deck-sku-sync.py"
      - "cloud-worker/mtgjson-deck-metadata-sync.py"
      - "cloud-worker/mtgjson-deck-content-sync.py"
      - "cloud-worker/refresh-sealed-commander-prices.mjs"
      - "cloud-worker/refresh-enabled-sealed.mjs"
      - "cloud-worker/archive-sealed-price-current.mjs"
      - "cloud-worker/refresh-precon-direct.mjs"
      - "cloud-worker/refresh-precon-ev.mjs"
      - ".github/workflows/mtgjson-sync.yml"

permissions:
  contents: read

concurrency:
  group: collectish-mtgjson-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: node --check cloud-worker/mtgjson-sync.mjs cloud-worker/refresh-sealed-commander-prices.mjs cloud-worker/refresh-enabled-sealed.mjs cloud-worker/archive-sealed-price-current.mjs cloud-worker/refresh-precon-direct.mjs cloud-worker/refresh-precon-ev.mjs
      - run: python -m py_compile cloud-worker/mtgjson-parquet-sync.py cloud-worker/mtgjson-set-sealed-sync.py cloud-worker/mtgjson-native-booster-backtest.py cloud-worker/mtgjson-deck-sku-sync.py cloud-worker/mtgjson-deck-metadata-sync.py cloud-worker/mtgjson-deck-content-sync.py

  hydrate-cmm:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MTGJSON_BASE_URL: https://mtgjson.com/api/v5
      MTGJSON_SET_CODES: CMM
      MTGJSON_SET_WORKERS: "1"
      MTGJSON_NATIVE_BOOSTER_SETS: CMM
      MTGJSON_NATIVE_BOOSTER_CODES: draft,set,collector,collector-sample
      MTGJSON_NATIVE_BOOSTER_SAMPLES: "30000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Require service role key
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Hydrate Commander Masters native booster metadata
        run: python cloud-worker/mtgjson-set-sealed-sync.py
      - name: Backtest Commander Masters native boosters
        run: python cloud-worker/mtgjson-native-booster-backtest.py

  sync:
    if: github.event_name != 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MTGJSON_BASE_URL: https://mtgjson.com/api/v5
      MTGJSON_PARQUET_BASE_URL: https://mtgjson.com/api/v5/parquet
      PRECON_RELEASE_FROM: "2025-01-01"
      PRECON_DIRECT_MIN_MARKET: "1"
      PRECON_DIRECT_CONCURRENCY: "4"
      SEALED_PRICE_STALE_HOURS: "24"
      SEALED_PRICE_CONCURRENCY: "3"
      SEALED_PRICE_BREAKER_ERRORS: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Resolve mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MTGJSON_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "0 12 * * 0" ]; then
            echo "MTGJSON_MODE=identity" >> "$GITHUB_ENV"
          else
            echo "MTGJSON_MODE=prices" >> "$GITHUB_ENV"
          fi
      - name: Require service role key
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install Parquet reader
        if: env.MTGJSON_MODE == 'identity' || env.MTGJSON_MODE == 'all'
        run: python -m pip install --disable-pip-version-check pyarrow==18.1.0
      - name: Import MTGJSON commerce catalog
        if: env.MTGJSON_MODE == 'identity' || env.MTGJSON_MODE == 'all'
        run: python cloud-worker/mtgjson-parquet-sync.py
      - name: Refresh MTGJSON print stats cache
        if: env.MTGJSON_MODE == 'identity' || env.MTGJSON_MODE == 'all'
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_mtgjson_print_stats_cache" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{}'
      - name: Enrich set structure from native JSON
        if: env.MTGJSON_MODE == 'identity' || env.MTGJSON_MODE == 'all'
        run: python cloud-worker/mtgjson-set-sealed-sync.py
      - name: Import deterministic deck NM English SKU mappings
        if: env.MTGJSON_MODE == 'identity' || env.MTGJSON_MODE == 'all'
        run: python cloud-worker/mtgjson-deck-sku-sync.py
      - name: Normalize deck sealed product identities
        if: env.MTGJSON_MODE == 'identity' || env.MTGJSON_MODE == 'all'
        run: python cloud-worker/mtgjson-deck-metadata-sync.py
      - name: Import MTGJSON deck contents
        if: env.MTGJSON_MODE == 'identity' || env.MTGJSON_MODE == 'all'
        run: python cloud-worker/mtgjson-deck-content-sync.py
      - name: Import MTGJSON daily prices
        if: env.MTGJSON_MODE == 'prices' || env.MTGJSON_MODE == 'all'
        run: node cloud-worker/mtgjson-sync.mjs prices
      - name: Refresh Scout current vendor price cache
        if: env.MTGJSON_MODE == 'prices' || env.MTGJSON_MODE == 'all'
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_scout_vendor_price_current_cache" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{}'
      - name: Refresh public TCG sealed Commander prices
        continue-on-error: true
        run: node cloud-worker/refresh-sealed-commander-prices.mjs
      - name: Refresh enabled sealed sets (exact identity only)
        continue-on-error: true
        run: node cloud-worker/refresh-enabled-sealed.mjs
      - name: Archive sealed price observations
        if: always()
        run: node cloud-worker/archive-sealed-price-current.mjs
      - name: Build current precon EV target cache
        if: always()
        run: node cloud-worker/refresh-precon-ev.mjs
      - name: Refresh economically meaningful precon Direct SKUs
        if: always()
        continue-on-error: true
        run: node cloud-worker/refresh-precon-direct.mjs
      - name: Recalculate recent Commander precon EV with fresh Direct data
        if: always()
        run: node cloud-worker/refresh-precon-ev.mjs
