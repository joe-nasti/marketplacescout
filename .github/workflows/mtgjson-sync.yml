name: Collectish MTGJSON sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: MTGJSON sync mode
        required: true
        default: prices
        type: choice
        options:
          - prices
          - identity
          - all
  schedule:
    - cron: "15 11 * * *"
    - cron: "0 12 * * 0"
  push:
    paths:
      - "cloud-worker/mtgjson-sync.mjs"
      - "cloud-worker/mtgjson-identity-sync.py"
      - ".github/workflows/mtgjson-sync.yml"

permissions:
  contents: read

concurrency:
  group: collectish-mtgjson-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --check cloud-worker/mtgjson-sync.mjs
      - run: python -m py_compile cloud-worker/mtgjson-identity-sync.py

  sync:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MTGJSON_BASE_URL: https://mtgjson.com/api/v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MTGJSON_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "MTGJSON_MODE=identity" >> "$GITHUB_ENV"
            echo "MTGJSON_SKIP_CARDS=1" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "0 12 * * 0" ]; then
            echo "MTGJSON_MODE=identity" >> "$GITHUB_ENV"
          else
            echo "MTGJSON_MODE=prices" >> "$GITHUB_ENV"
          fi
      - name: Require service role key
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install streaming parser
        if: env.MTGJSON_MODE == 'identity' || env.MTGJSON_MODE == 'all'
        run: python -m pip install --disable-pip-version-check ijson==3.3.0
      - name: Import MTGJSON identity graph
        if: env.MTGJSON_MODE == 'identity' || env.MTGJSON_MODE == 'all'
        run: python cloud-worker/mtgjson-identity-sync.py
      - name: Import MTGJSON daily prices
        if: env.MTGJSON_MODE == 'prices' || env.MTGJSON_MODE == 'all'
        run: node cloud-worker/mtgjson-sync.mjs prices
