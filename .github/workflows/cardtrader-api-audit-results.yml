name: Capture CardTrader API audit results

on:
  push:
    branches:
      - agent/cardtrader-api-audit
    paths:
      - .github/workflows/cardtrader-api-audit-results.yml
      - tools/cardtrader-api-audit.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARDTRADER_JWT_TOKEN: ${{ secrets.CARDTRADER_JWT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cardtrader-api-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run and capture read-only CardTrader identifier audit
        shell: bash
        run: |
          mkdir -p audit-results
          if [ -z "$CARDTRADER_JWT_TOKEN" ]; then
            echo "Missing CARDTRADER_JWT_TOKEN" > audit-results/cardtrader-audit-status.txt
            status=2
          else
            set +e
            node tools/cardtrader-api-audit.mjs > audit-results/cardtrader-identifier-audit-run.txt 2>&1
            status=$?
            set -e
            echo "exit_code=$status" > audit-results/cardtrader-audit-status.txt
            if [ -f cardtrader-identifier-audit.json ]; then cp cardtrader-identifier-audit.json audit-results/cardtrader-identifier-audit.json; fi
            if [ -f cardtrader-identifier-audit.md ]; then cp cardtrader-identifier-audit.md audit-results/cardtrader-identifier-audit.md; fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-results
          if ! git diff --cached --quiet; then
            git commit -m "capture CardTrader identifier audit results"
            git push origin HEAD:agent/cardtrader-api-audit
          fi
          exit $status
