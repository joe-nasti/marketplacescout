name: Refresh enabled sealed sets

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */4 * * *"

permissions:
  contents: read

concurrency:
  group: collectish-database-heavy-syncs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEALED_PRICE_STALE_HOURS: "24"
      SEALED_PRICE_CONCURRENCY: "3"
      SEALED_PRICE_BREAKER_ERRORS: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require service role key
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Validate sealed workers
        run: node --check cloud-worker/refresh-enabled-sealed.mjs cloud-worker/apply-sealed-language-confidence.mjs cloud-worker/archive-sealed-price-current.mjs
      - name: Refresh exact sealed pricing and EV for enabled sets
        run: node cloud-worker/refresh-enabled-sealed.mjs
      - name: Refresh FIN Chocobo pack distribution
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_fin_chocobo_pack_ev_model" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{}'
      - name: Refresh executable sealed EV cache
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_sealed_product_executable_ev_cache" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{}'
      - name: Apply sealed language confidence
        run: node cloud-worker/apply-sealed-language-confidence.mjs
      - name: Archive sealed price observations
        if: always()
        run: node cloud-worker/archive-sealed-price-current.mjs
