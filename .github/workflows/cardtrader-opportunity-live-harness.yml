name: Temporary CardTrader opportunity validation harness

on:
  pull_request:
    branches: [main]
    paths:
      - cloud-worker/cardtrader-opportunity-refresh.mjs
      - src/modules/sealed/cardtrader-opportunities.js
      - src/modules/sealed/index.js
      - .github/workflows/cardtrader-sealed-refresh.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/cardtrader-opportunity-view'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate CT0 opportunity worker and UI
        run: node --check cloud-worker/cardtrader-opportunity-refresh.mjs && node --check src/modules/sealed/cardtrader-opportunities.js
      - name: Run CT0 opportunity rank against current feed
        run: node cloud-worker/cardtrader-opportunity-refresh.mjs
