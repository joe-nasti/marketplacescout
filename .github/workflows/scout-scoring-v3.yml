name: Collectish Scout v3 recalculation

on:
  workflow_dispatch:
  schedule:
    - cron: "12 */3 * * *"
  push:
    paths:
      - ".github/workflows/scout-scoring-v3.yml"
      - "cloud-worker/recalculate-scout-base-v3.mjs"

permissions:
  contents: read

concurrency:
  group: collectish-scout-v3-recalculation
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate v3 worker
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          node --check cloud-worker/recalculate-scout-base-v3.mjs
      - name: Recalculate Scout v3 and refresh snapshot
        run: node cloud-worker/recalculate-scout-base-v3.mjs
