name: Temporary CardTrader API audit harness

on:
  pull_request:
    branches: [main]
    paths:
      - tools/cardtrader-api-audit.mjs
      - .github/workflows/cardtrader-api-audit-pr.yml

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'agent/cardtrader-api-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARDTRADER_JWT_TOKEN: ${{ secrets.CARDTRADER_JWT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require CardTrader token
        run: test -n "$CARDTRADER_JWT_TOKEN"
      - name: Run read-only CardTrader audit
        run: node tools/cardtrader-api-audit.mjs
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardtrader-api-audit
          path: |
            cardtrader-audit.json
            cardtrader-audit.md
          if-no-files-found: warn
          retention-days: 7
