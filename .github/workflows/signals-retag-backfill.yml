name: Signals card-tag backfill

# Push-triggered runs intentionally exercise a small acceptance set; manual runs can retag broader history.
on:
  workflow_dispatch:
    inputs:
      days:
        description: Days of recent Signals to retag
        required: false
        default: "14"
      limit:
        description: Maximum distinct source URLs
        required: false
        default: "40"
      match:
        description: Optional pipe-delimited URL substrings to retag
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/signals-retag-backfill.yml"
      - "cloud-worker/retag-recent-signals.mjs"
      - "supabase/functions/market-intel-card-tag/**"

permissions:
  contents: read

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SIGNALS_RETAG_DAYS: ${{ github.event.inputs.days || '14' }}
      SIGNALS_RETAG_LIMIT: ${{ github.event.inputs.limit || '40' }}
      SIGNALS_RETAG_CONCURRENCY: "2"
      SIGNALS_RETAG_MATCH: ${{ github.event_name == 'push' && 'best-mardu-lands-for-commander|mtg-underrated-mardu-commanders|mtg-illusion|full-contents-of-the-most-powerful-superdrop' || github.event.inputs.match || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate worker
        run: node --check cloud-worker/retag-recent-signals.mjs
      - name: Retag recent Signals sources
        run: node cloud-worker/retag-recent-signals.mjs
