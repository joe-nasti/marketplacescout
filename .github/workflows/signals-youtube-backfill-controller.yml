name: Collectish YouTube requested backfills

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/signals-youtube-backfill-controller.yml"
      - "cloud-worker/youtube-backfill-controller.mjs"
      - "cloud-worker/youtube-ledger-discovery.mjs"
      - "supabase/functions/market-intel-youtube-ledger-evaluate/**"
      - "supabase/functions/market-intel-video-product-event-extract/**"

permissions:
  contents: read

concurrency:
  group: collectish-youtube-requested-backfills
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EVALUATOR_URL: https://bnsnlikjeogzdubgyvxk.supabase.co/functions/v1/market-intel-youtube-ledger-evaluate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate workers
        run: |
          node --check cloud-worker/youtube-ledger-discovery.mjs
          node --check cloud-worker/youtube-backfill-controller.mjs
      - name: Deepen requested channel discovery
        run: node cloud-worker/youtube-ledger-discovery.mjs
      - name: Queue requested backlog
        run: node cloud-worker/youtube-backfill-controller.mjs
      - name: Evaluate queued videos
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --max-time 145 --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Content-Type: application/json" --data '{"limit":1}' "$EVALUATOR_URL")"
            cat "$response_file"
            echo
            test "$status" -ge 200 -a "$status" -lt 300
            jq -e 'all(.results[]?; ((.events // 0) == ((.card_events // 0) + (.product_events // 0))))' "$response_file" >/dev/null
            processed="$(jq -r '.processed // 0' "$response_file")"
            rm -f "$response_file"
            if (( processed == 0 )); then break; fi
          done
      - name: Refill backlog after evaluation
        run: node cloud-worker/youtube-backfill-controller.mjs
