name: Temporary CardTrader shadow validation harness

on:
  pull_request:
    branches: [main]
    paths:
      - cloud-worker/cardtrader-shadow-score-refresh.mjs
      - src/modules/sealed/cardtrader.js
      - .github/workflows/cardtrader-sealed-refresh.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/cardtrader-shadow-score-actual'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate CT0 shadow worker and UI
        run: node --check cloud-worker/cardtrader-shadow-score-refresh.mjs && node --check src/modules/sealed/cardtrader.js
      - name: Run CT0 shadow model against current feed
        run: node cloud-worker/cardtrader-shadow-score-refresh.mjs
