name: Deploy Collectish web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'src/**'
      - 'tools/finalize-vite-build.mjs'
      - 'manifest.webmanifest'
      - 'collectish-icon-*.png'
      - '.github/workflows/deploy-vite-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: collectish-vite-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLECTISH_WEB_REVISION: r${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Enforce modular source tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) ! -name 'vite.config.js' -print)"
          test -z "$(find . -maxdepth 1 -type f \( -name 'current-*' -o -name 'v0*.js' -o -name 'v0*.css' \) -print)"
          test -d src/core
          test -d src/state
          test -d src/modules/scout
          test -d src/modules/sealed
          test -d src/modules/seller
          test -d src/modules/admin
          test -d src/styles
          grep -q "./styles/index.css" src/main.js
          grep -q "./core/shell.js" src/main.js
          grep -q "./state/store.js" src/main.js
          grep -q "./modules/index.js" src/main.js
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Publish source-gate status
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-source-gate' -f description='Modular frontend source gate passed'
      - name: Install pinned Vite
        run: npm install --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/.vite/manifest.json
          test -s dist/web-version.json
          grep -Eq 'assets/[^" ]+-[A-Za-z0-9_-]+\.js' dist/index.html
          grep -Eq 'assets/[^" ]+-[A-Za-z0-9_-]+\.css' dist/index.html
          ! grep -Eq '(current-|v0[0-9]+\.(js|css))' dist/index.html
          node -e "const v=require('./dist/web-version.json');if(v.build!==process.env.GITHUB_SHA)process.exit(1)"
      - name: Publish build statuses
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-build' -f description='Vite production bundle built successfully'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-artifact' -f description='Hashed production artifact validated'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live build
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for i in {1..60}; do
            if curl -fsSL "$base/web-version.json?cb=$(date +%s%N)" -o /tmp/web-version.json && node -e "const v=require('/tmp/web-version.json');process.exit(v.build===process.env.EXPECTED_SHA?0:1)"; then break; fi
            sleep 5
          done
          node -e "const v=require('/tmp/web-version.json');if(v.build!==process.env.EXPECTED_SHA)process.exit(1)"
      - name: Browser smoke
        shell: bash
        env: { PAGE_URL: '${{ steps.deployment.outputs.page_url }}' }
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "${PAGE_URL%/}/?smoke=${GITHUB_RUN_ID}" >/tmp/dom.html 2>/tmp/chrome.log
          grep -Eq 'modernSignIn|collectish-product-shell|cx-auth-card' /tmp/dom.html
          ! grep -q 'Could not start Collectish' /tmp/dom.html
      - name: Publish live smoke statuses
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}', PAGE_URL: '${{ steps.deployment.outputs.page_url }}' }
        run: |
          for context in collectish/vite-pages-version collectish/vite-chrome-run collectish/vite-shell-dom collectish/vite-browser-smoke collectish/vite-live-smoke; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context="$context" -f description='Collectish modular Vite deployment verified' -f target_url="$PAGE_URL"
          done
