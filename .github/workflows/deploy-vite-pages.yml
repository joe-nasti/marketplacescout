name: Deploy Vite web to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'vite.config.js'
      - 'index.html'
      - 'src/**'
      - 'tools/finalize-vite-build.mjs'
      - 'modern-core.css'
      - 'current-*.js'
      - 'current-*.css'
      - 'manifest.webmanifest'
      - 'collectish-icon-*.png'
      - '.github/workflows/deploy-vite-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: collectish-vite-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLECTISH_WEB_REVISION: r110${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce ESM ownership boundaries
        id: source_gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/legacy-runtime.js
          test ! -e src/run-classic.js
          test ! -e vite-index.html
          ! grep -R --line-number --fixed-strings '?raw' src
          ! grep -R --line-number 'runClassicSequence\|legacy-runtime' src
          grep -q '<script type="module" src="/src/main.js"></script>' index.html
          ! grep -Eq '<script[^>]+current-.*\.js' index.html
          ! grep -Eq '<link[^>]+current-.*\.css' index.html
          grep -q "from './runtime/shell.js'" src/main.js
          grep -q "from './runtime/rest.js'" src/main.js
          grep -q "from './features/scout/cache-read.js'" src/main.js
          grep -q "from './features/install-remaining.js'" src/main.js
          grep -q "./features/scout/bootstrap.js" src/main.js
          grep -q "./features/scout/health.js" src/main.js
          grep -q "./features/ask/markdown.js" src/main.js
          grep -q "./features/sealed/ui-guardian.js" src/main.js
          grep -q "./features/seller/readonly-agent.js" src/main.js
          node --check src/main.js
          node --check src/lazy-pages.js
          node --check src/features/install-remaining.js
          node --check src/features/sealed.js
          node --check src/features/seller.js
          node --check src/features/syp.js
          node --check src/runtime/shell.js
          node --check src/runtime/session.js
          node --check src/runtime/rest.js
          node --check src/runtime/build-info.js
          node --check src/runtime/theme.js
          node --check src/runtime/health.js
          node --check src/features/scout/cache-read.js
          node --check src/features/scout/bootstrap.js
          node --check src/features/scout/index.js
          node --check src/features/scout/health.js
          node --check src/features/sealed/ui-guardian.js
          node --check src/features/ask/markdown.js
          node --check src/features/seller/readonly-agent.js

      - name: Publish source-gate success status
        if: success()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-source-gate' -f description='Native ESM source gate passed'
      - name: Publish source-gate failure status
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context='collectish/vite-source-gate' -f description='Native ESM source gate failed'

      - name: Install pinned Vite toolchain
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        id: vite_build
        run: npm run build
      - name: Publish Vite-build success status
        if: success()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-build' -f description='Vite production bundle built successfully'
      - name: Publish Vite-build failure status
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context='collectish/vite-build' -f description='Vite production bundle failed'

      - name: Validate production artifact
        id: artifact_gate
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/.vite/manifest.json
          test -s dist/manifest.webmanifest
          test -s dist/collectish-icon-192.png
          test -s dist/build-version.json
          test -s dist/web-version.json
          grep -Eq 'assets/[^" ]+-[A-Za-z0-9_-]+\.js' dist/index.html
          grep -Eq 'assets/[^" ]+-[A-Za-z0-9_-]+\.css' dist/index.html
          ! grep -Eq '<script[^>]+current-.*\.js' dist/index.html
          ! grep -Eq '<link[^>]+current-.*\.css' dist/index.html
          ! grep -Eq '<script[^>]+modern-core\.js' dist/index.html
          grep -q 'collectish-build' dist/index.html
          grep -q 'collectish-revision' dist/index.html
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/.vite/manifest.json','utf8'));if(!Object.keys(m).length)process.exit(1)"
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('dist/web-version.json','utf8'));if(v.build!==process.env.GITHUB_SHA)process.exit(1);if(v.label!==process.env.COLLECTISH_WEB_REVISION)process.exit(1)"
      - name: Publish artifact-gate success status
        if: success()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-artifact' -f description='Hashed production artifact validated'
      - name: Publish artifact-gate failure status
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context='collectish/vite-artifact' -f description='Production artifact validation failed'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy validated Vite artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages version
        id: live_version
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REV: r110${{ github.run_number }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for i in {1..18}; do
            if curl -fsSL --retry 2 --retry-delay 2 "$base/web-version.json?cb=$RANDOM" -o /tmp/web-version.json; then
              if node -e "const v=require('/tmp/web-version.json');process.exit(v.build===process.env.EXPECTED_SHA&&v.label===process.env.EXPECTED_REV?0:1)"; then exit 0; fi
            fi
            sleep 5
          done
          cat /tmp/web-version.json || true
          exit 1

      - name: Publish Pages-version success status
        if: success()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}', PAGE_URL: '${{ steps.deployment.outputs.page_url }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-pages-version' -f description='Live Pages version matches deployed Vite build' -f target_url="$PAGE_URL"
      - name: Publish Pages-version failure status
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context='collectish/vite-pages-version' -f description='Live Pages version did not match deployed build'

      - name: Check headless Chrome availability
        if: success()
        id: chrome_binary
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          echo "chrome=$chrome" >> "$GITHUB_OUTPUT"
      - name: Publish Chrome-binary success status
        if: success()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-chrome-binary' -f description='Headless Chrome binary available'
      - name: Publish Chrome-binary failure status
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context='collectish/vite-chrome-binary' -f description='No Chrome/Chromium binary on runner'

      - name: Execute frontend in headless Chrome
        if: success()
        id: chrome_run
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CHROME: ${{ steps.chrome_binary.outputs.chrome }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "$base/?smoke=${GITHUB_RUN_ID}" >/tmp/collectish-dom.html 2>/tmp/chrome.log
          test -s /tmp/collectish-dom.html
      - name: Publish Chrome-run success status
        if: success()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-chrome-run' -f description='Headless Chrome loaded the live page'
      - name: Publish Chrome-run failure status
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context='collectish/vite-chrome-run' -f description='Headless Chrome process failed'

      - name: Validate rendered Collectish shell
        if: success()
        id: shell_dom
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'Could not start Collectish' /tmp/collectish-dom.html
          grep -Eq 'modernSignIn|collectish-product-shell|cx-auth-card' /tmp/collectish-dom.html
      - name: Publish browser-smoke success status
        if: success()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}', PAGE_URL: '${{ steps.deployment.outputs.page_url }}' }
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-shell-dom' -f description='Collectish shell rendered in Chrome' -f target_url="$PAGE_URL"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-browser-smoke' -f description='Headless Chrome executed Collectish frontend' -f target_url="$PAGE_URL"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-live-smoke' -f description='Vite Pages deploy and browser smoke passed' -f target_url="$PAGE_URL"
      - name: Publish shell-DOM failure status
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context='collectish/vite-shell-dom' -f description='Collectish shell marker missing or startup error rendered'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context='collectish/vite-browser-smoke' -f description='Headless Chrome frontend smoke failed'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context='collectish/vite-live-smoke' -f description='Vite Pages browser smoke failed'
