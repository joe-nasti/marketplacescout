name: Deploy Vite web to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'vite.config.js'
      - 'vite-index.html'
      - 'src/**'
      - 'tools/finalize-vite-build.mjs'
      - 'modern-core.js'
      - 'modern-core.css'
      - 'config.js'
      - 'current-*.js'
      - 'current-*.css'
      - 'manifest.webmanifest'
      - 'collectish-icon-*.png'
      - '.github/workflows/deploy-vite-pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collectish-vite-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLECTISH_WEB_REVISION: r${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Vite toolchain
        run: npm install --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/.vite/manifest.json
          test -s dist/manifest.webmanifest
          test -s dist/collectish-icon-192.png
          test -s dist/build-version.json
          test -s dist/web-version.json
          grep -Eq 'assets/[^" ]+-[A-Za-z0-9_-]+\.js' dist/index.html
          grep -Eq 'assets/[^" ]+-[A-Za-z0-9_-]+\.css' dist/index.html
          ! grep -Eq '<script[^>]+current-.*\.js' dist/index.html
          ! grep -Eq '<link[^>]+current-.*\.css' dist/index.html
          ! grep -Eq '<script[^>]+modern-core\.js' dist/index.html
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/.vite/manifest.json','utf8'));if(!Object.keys(m).length)process.exit(1)"
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('dist/web-version.json','utf8'));if(v.build!==process.env.GITHUB_SHA)process.exit(1);if(v.label!==process.env.COLLECTISH_WEB_REVISION)process.exit(1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy validated Vite artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record successful cutover proof
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_SHA: ${{ github.sha }}
          REVISION: r${{ github.run_number }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, datetime
          Path('vite-deploy-status.json').write_text(json.dumps({
            'status':'deployed',
            'build':os.environ['BUILD_SHA'],
            'revision':os.environ['REVISION'],
            'page_url':os.environ.get('PAGE_URL',''),
            'deployed_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          },separators=(',',':'))+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite-deploy-status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Vite Pages deployment [skip ci]"
          git push
