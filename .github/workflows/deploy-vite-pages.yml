name: Deploy Collectish web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'src/**'
      - 'tools/finalize-vite-build.mjs'
      - 'tools/check-source-hygiene.mjs'
      - 'tools/check-style-system.mjs'
      - 'manifest.webmanifest'
      - 'collectish-icon-*.png'
      - '.github/workflows/deploy-vite-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: collectish-vite-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLECTISH_WEB_REVISION: r${{ github.run_number }}
      VITE_COLLECTISH_ASK_STREAM_URL: ${{ vars.COLLECTISH_ASK_STREAM_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Enforce modular source tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) ! -name 'vite.config.js' -print)"
          test -z "$(find . -maxdepth 1 -type f \( -name 'current-*' -o -name 'v0*.js' -o -name 'v0*.css' \) -print)"
          for d in src/core src/state src/modules/scout src/modules/sealed src/modules/seller src/modules/admin src/styles; do test -d "$d"; done
          test -f src/core/lifecycle.js
          test -f src/state/store.js
          test -f src/state/resources.js
          test -f src/app.js
          test ! -e src/modules/sealed/ui-guardian.js
          grep -q "./styles/index.css" src/main.js
          grep -q "./app.js" src/main.js
          grep -q "./core/shell.js" src/app.js
          grep -q "./state/store.js" src/app.js
          grep -q "./modules/index.js" src/app.js

      - name: Audit centralized lifecycle
        id: lifecycle
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/lifecycle-offenders.txt
          grep -RIl --include='*.js' -E 'new[[:space:]]+MutationObserver|MutationObserver[[:space:]]*\(' src \
            | grep -v '^src/modules/signals/competitive-evidence\.js$' \
            >> /tmp/lifecycle-offenders.txt || true
          grep -RIl --include='*.js' -E "createElement\(['\"]script['\"]\)|createElement\(\`script\`\)" src >> /tmp/lifecycle-offenders.txt || true
          sort -u /tmp/lifecycle-offenders.txt -o /tmp/lifecycle-offenders.txt
          if [ -s /tmp/lifecycle-offenders.txt ]; then
            first="$(head -1 /tmp/lifecycle-offenders.txt)"
            echo "first=$first" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Publish source/lifecycle status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RESULT: ${{ steps.lifecycle.outcome }}
          FIRST: ${{ steps.lifecycle.outputs.first }}
        shell: bash
        run: |
          if [ "$RESULT" = success ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-source-gate' -f description='Centralized lifecycle/state source gate passed'
          else
            token="$(printf '%s' "${FIRST:-unknown}" | sed 's#src/modules/##;s#src/core/##;s#[/.]#-#g' | cut -c1-70)"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context="collectish/lifecycle-offender-${token:-unknown}" -f description="Observer/script lifecycle violation: ${FIRST:-unknown}"
            exit 1
          fi

      - name: Validate tokenized style system
        id: styles
        continue-on-error: true
        run: node tools/check-style-system.mjs

      - name: Publish style-system status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RESULT: ${{ steps.styles.outcome }}
        shell: bash
        run: |
          if [ "$RESULT" = success ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/style-system' -f description='Tokenized CSS/theme contract passed'
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context='collectish/style-system' -f description='Tokenized CSS/theme contract failed'
            exit 1
          fi

      - name: Install pinned Vite
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        id: vite_build
        continue-on-error: true
        run: npm run build

      - name: Publish Vite-build status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RESULT: ${{ steps.vite_build.outcome }}
        shell: bash
        run: |
          if [ "$RESULT" = success ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-build' -f description='Vite production bundle built successfully'
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context='collectish/vite-build' -f description='Vite production bundle failed to build'
            exit 1
          fi

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/.vite/manifest.json
          test -s dist/web-version.json
          grep -Eq 'assets/[^" ]+[.-][A-Za-z0-9_-]+\.js' dist/index.html
          grep -Eq 'assets/[^" ]+[.-][A-Za-z0-9_-]+\.css' dist/index.html
          grep -q 'name="collectish-build"' dist/index.html
          grep -q 'name="collectish-revision"' dist/index.html
          ! grep -Eq '(current-|v0[0-9]+\.(js|css))' dist/index.html
          node -e "const v=require('./dist/web-version.json');if(v.build!==process.env.GITHUB_SHA||v.label!==process.env.COLLECTISH_WEB_REVISION||v.version==='unknown')process.exit(1)"

      - name: Publish artifact status
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ github.sha }}' }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='collectish/vite-artifact' -f description='Hashed production artifact validated'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live build
        id: live_version
        continue-on-error: true
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for i in {1..60}; do
            if curl -fsSL "$base/web-version.json?cb=$(date +%s%N)" -o /tmp/web-version.json && node -e "const v=require('/tmp/web-version.json');process.exit(v.build===process.env.EXPECTED_SHA?0:1)"; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Publish live-version status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RESULT: ${{ steps.live_version.outcome }}
        run: |
          state=success; desc='Live Pages version matches tokenized Vite build'
          if [ "$RESULT" != success ]; then state=failure; desc='Live Pages build did not converge'; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state="$state" -f context='collectish/vite-pages-version' -f description="$desc" -f target_url="$PAGE_URL"

      - name: Check Chrome availability
        id: chrome_binary
        continue-on-error: true
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          echo "chrome=$chrome" >> "$GITHUB_OUTPUT"

      - name: Execute Chrome
        id: chrome_run
        if: steps.chrome_binary.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CHROME: ${{ steps.chrome_binary.outputs.chrome }}
        run: |
          set -euo pipefail
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom "${PAGE_URL%/}/?smoke=${GITHUB_RUN_ID}&cb=$(date +%s%N)" >/tmp/dom.html 2>/tmp/chrome.log
          test -s /tmp/dom.html

      - name: Validate shell DOM
        id: shell_dom
        if: steps.chrome_run.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'modernSignIn|collectish-product-shell|cx-auth-card' /tmp/dom.html
          ! grep -q 'Could not start Collectish' /tmp/dom.html

      - name: Publish browser statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CHROME_RESULT: ${{ steps.chrome_run.outcome }}
          DOM_RESULT: ${{ steps.shell_dom.outcome }}
        run: |
          chrome_state=success; chrome_desc='Headless Chrome loaded tokenized theme build'
          [ "$CHROME_RESULT" = success ] || { chrome_state=failure; chrome_desc='Headless Chrome process failed'; }
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state="$chrome_state" -f context='collectish/vite-chrome-run' -f description="$chrome_desc" -f target_url="$PAGE_URL"
          dom_state=success; dom_desc='Tokenized Collectish shell rendered in Chrome'
          [ "$DOM_RESULT" = success ] || { dom_state=failure; dom_desc='Tokenized shell DOM validation failed'; }
          for context in collectish/vite-shell-dom collectish/vite-browser-smoke collectish/vite-live-smoke; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state="$dom_state" -f context="$context" -f description="$dom_desc" -f target_url="$PAGE_URL"
          done
