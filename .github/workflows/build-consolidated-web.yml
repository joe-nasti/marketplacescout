name: Validate Collectish web and build Android

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "collectish-icon-*.png"
      - "config.js"
      - "modern-core.js"
      - "modern-core.css"
      - "current-*.js"
      - "current-*.css"
      - "tools/patch-native-v0*.py"
      - "android-agent/**"
      - ".github/workflows/build-consolidated-web.yml"

permissions:
  contents: read

concurrency:
  group: collectish-unified-build
  cancel-in-progress: false

jobs:
  web-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate hosted Collectish shell
        shell: bash
        run: |
          set -euo pipefail
          for f in modern-core.js current-*.js; do node --check "$f"; done
          grep -q "VERSION='0.9.52'" modern-core.js
          grep -q 'modern-core.js?v=0952' index.html
          grep -q 'refreshInFlight' modern-core.js
          grep -q 'jwt issued at future' modern-core.js
          grep -q 'serverExp' modern-core.js
          grep -q 'collectish:auth-invalid' modern-core.js
          grep -q 'current-rest-read-retry.js?v=0958' index.html
          grep -q 'current-lazy-data-pages.js?v=0958' index.html
          grep -q 'current-runtime-health.js?v=0958' index.html
          grep -q 'statement_timeout_retries' current-rest-read-retry.js
          grep -q "method!=='GET'" current-rest-read-retry.js
          grep -q 'collectish:runtime-health' current-rest-read-retry.js
          grep -q "sealed:\[" current-lazy-data-pages.js
          grep -q "seller:\[" current-lazy-data-pages.js
          grep -q "syp:\[" current-lazy-data-pages.js
          grep -q 'collectish:lazy-page-loaded' current-lazy-data-pages.js
          grep -q 'Runtime health' current-runtime-health.js
          grep -q 'scout_first_load_ms' current-runtime-health.js
          ! grep -q '<script src="current-sealed-ev.js' index.html
          ! grep -q '<script src="current-seller-parity.js' index.html
          ! grep -q '<script src="current-syp-parity.js' index.html
          grep -q 'current-ask-collectish-v3-investigate-safe.js?v=0955' index.html
          grep -q 'current-ask-collectish-v3-actions-safe.js?v=0952' index.html
          grep -q 'current-ask-collectish-v3-admin-safe.js?v=0952' index.html
          grep -q 'current-ask-markdown-safe.js?v=0955' index.html
          grep -q 'current-ask-markdown-safe.css?v=0955' index.html
          grep -q 'current-ask-investigate-presentation.js?v=0956' index.html
          grep -q 'current-ask-investigate-presentation.css?v=0956' index.html
          grep -q 'current-ask-concise-view.js?v=0959' index.html
          grep -q 'current-ask-concise-view.css?v=0959' index.html
          grep -q 'progressive disclosure' current-ask-concise-view.js
          grep -q 'Show deeper evidence' current-ask-concise-view.js
          grep -q 'Show full analysis' current-ask-concise-view.js
          grep -q 'CORE SETUP' current-ask-concise-view.js
          ! grep -q 'MutationObserver' current-ask-concise-view.js
          ! grep -q 'window.fetch=' current-ask-concise-view.js
          ! grep -q '<script src="current-ask-collectish-v3.js' index.html
          ! grep -q '<script src="current-ask-collectish-v3-diagnostics.js' index.html
          grep -q 'no MutationObserver' current-ask-collectish-v3-investigate-safe.js
          grep -q 'No startup RPCs, no MutationObserver' current-ask-collectish-v3-actions-safe.js
          grep -q 'No startup RPCs or observers' current-ask-collectish-v3-admin-safe.js
          grep -q 'event-driven only' current-ask-markdown-safe.js
          grep -q 'event-driven only' current-ask-investigate-presentation.js
          ! grep -q 'MutationObserver' current-ask-investigate-presentation.js
          ! grep -q 'window.fetch=' current-ask-investigate-presentation.js
          grep -q 'CollectishRenderMarkdown' current-ask-collectish-v3-investigate-safe.js
          grep -q 'cx-investigate-summary' current-ask-investigate-presentation.css
          grep -q "action:'investigate'" current-ask-collectish-v3-investigate-safe.js
          grep -q 'ask_collectish_pending_confirmations' current-ask-collectish-v3-actions-safe.js
          grep -q "action:'confirm_action'" current-ask-collectish-v3-actions-safe.js
          grep -q 'ask_collectish_get_purchase_list' current-ask-collectish-v3-actions-safe.js
          grep -q 'ask_collectish_v3_diagnostics_summary' current-ask-collectish-v3-admin-safe.js
          grep -q 'applyUiActions' current-ask-collectish.js
          grep -q 'scout_opportunities_v5' current-scout-v5-promoted.js
          grep -q '#0b1538' current-theme.css
          grep -q '#1866e8' current-theme.css
          test -s collectish-icon-192.png

  android-agent:
    runs-on: ubuntu-latest
    env:
      COLLECTISH_ANDROID_KEYSTORE_B64: ${{ secrets.COLLECTISH_ANDROID_KEYSTORE_B64 }}
      COLLECTISH_KEYSTORE_PASSWORD: ${{ secrets.COLLECTISH_ANDROID_KEYSTORE_PASSWORD }}
      COLLECTISH_KEY_ALIAS: ${{ secrets.COLLECTISH_ANDROID_KEY_ALIAS }}
      COLLECTISH_KEY_PASSWORD: ${{ secrets.COLLECTISH_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Require persistent signing secrets
        shell: bash
        run: |
          test -n "$COLLECTISH_ANDROID_KEYSTORE_B64"
          test -n "$COLLECTISH_KEYSTORE_PASSWORD"
          test -n "$COLLECTISH_KEY_ALIAS"
          test -n "$COLLECTISH_KEY_PASSWORD"
      - name: Restore and verify signing key
        shell: bash
        run: |
          printf '%s' "$COLLECTISH_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/collectish-release.jks"
          test -s "$RUNNER_TEMP/collectish-release.jks"
          echo "COLLECTISH_KEYSTORE_FILE=$RUNNER_TEMP/collectish-release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/collectish-release.jks" -storepass "$COLLECTISH_KEYSTORE_PASSWORD" -alias "$COLLECTISH_KEY_ALIAS" >/dev/null
      - name: Apply Android 0.2.8 patch chain
        shell: bash
        run: |
          python tools/patch-native-v021.py
          python tools/patch-native-v022.py
          python tools/patch-native-v023.py
          python tools/patch-native-v024.py
          python tools/patch-native-v025.py
          python tools/patch-native-v026.py
          python tools/patch-native-v027.py
          python tools/patch-native-v028.py
      - name: Align and verify Android metadata and branding
        working-directory: android-agent
        shell: bash
        run: |
          sed -i -E 's/private val version = "[0-9.]+"/private val version = "0.2.8"/' app/src/main/java/com/collectish/agent/MainActivity.kt
          sed -i -E 's/versionCode = [0-9]+/versionCode = 28/' app/build.gradle.kts
          sed -i -E 's/versionName = "[0-9.]+"/versionName = "0.2.8"/' app/build.gradle.kts
          grep -q 'setTheme(theme:String)' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'Color.rgb(11, 21, 56)' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'android:icon="@drawable/collectish_launcher"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/collectish_launcher.xml
          grep -q '#0B1538' app/src/main/res/drawable/collectish_launcher.xml
          grep -q '#1866E8' app/src/main/res/drawable/collectish_launcher.xml
          grep -q 'versionCode = 28' app/build.gradle.kts
          grep -q 'versionName = "0.2.8"' app/build.gradle.kts
      - name: Build persistently signed Android APK
        working-directory: android-agent
        run: |
          gradle :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/collectish-android-agent.apk"
      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/collectish-android-agent.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: collectish-android-agent-v0.2.8-signed
          path: ${{ runner.temp }}/collectish-android-agent.apk
