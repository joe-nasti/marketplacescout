name: Build consolidated Collectish web

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build-consolidated-web.mjs"
      - "current-data.js"
      - "current-agent.js"
      - "v059.js"
      - "android-agent/**"
      - ".github/workflows/build-consolidated-web.yml"

permissions:
  contents: write

concurrency:
  group: collectish-web-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build consolidated app
        run: node tools/build-consolidated-web.mjs
      - name: Validate JavaScript
        run: node --check collectish-app.js
      - name: Commit generated web release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collectish-app.js collectish-app.css index.html
          if git diff --cached --quiet; then
            echo "Generated web assets already current."
            exit 0
          fi
          git commit -m "Build consolidated Collectish web v0.7.5"
          git push origin HEAD:main

  android-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Android debug APK
        working-directory: android-agent
        run: gradle :app:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: collectish-android-agent-debug
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
