name: Build consolidated Collectish web

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build-consolidated-web.mjs"
      - "tools/patch-native-v021.py"
      - "tools/patch-native-v022.py"
      - "current-data.js"
      - "current-agent.js"
      - "current-readonly-agent.js"
      - "current-ux.js"
      - "current-ux-guard.js"
      - "current-ux-recovery.js"
      - "current-ux.css"
      - "v059.js"
      - "android-agent/**"
      - ".github/workflows/build-consolidated-web.yml"

permissions:
  contents: write

concurrency:
  group: collectish-web-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build consolidated app
        run: node tools/build-consolidated-web.mjs
      - name: Validate JavaScript
        run: node --check collectish-app.js
      - name: Commit generated web release
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Skipping generated asset push from stale workflow revision."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collectish-app.js collectish-app.css index.html
          if git diff --cached --quiet; then
            echo "Generated web assets already current."
            exit 0
          fi
          git commit -m "Build consolidated Collectish web v0.8.1"
          git push origin HEAD:main

  android-agent:
    runs-on: ubuntu-latest
    env:
      COLLECTISH_ANDROID_KEYSTORE_B64: ${{ secrets.COLLECTISH_ANDROID_KEYSTORE_B64 }}
      COLLECTISH_KEYSTORE_PASSWORD: ${{ secrets.COLLECTISH_ANDROID_KEYSTORE_PASSWORD }}
      COLLECTISH_KEY_ALIAS: ${{ secrets.COLLECTISH_ANDROID_KEY_ALIAS }}
      COLLECTISH_KEY_PASSWORD: ${{ secrets.COLLECTISH_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore persistent Collectish signing key
        if: ${{ env.COLLECTISH_ANDROID_KEYSTORE_B64 != '' && env.COLLECTISH_KEYSTORE_PASSWORD != '' && env.COLLECTISH_KEY_ALIAS != '' && env.COLLECTISH_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          printf '%s' "$COLLECTISH_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/collectish-release.jks"
          echo "COLLECTISH_KEYSTORE_FILE=$RUNNER_TEMP/collectish-release.jks" >> "$GITHUB_ENV"
      - name: Apply native 0.2.1 UI patch
        shell: bash
        run: python tools/patch-native-v021.py
      - name: Apply native 0.2.2 SYP patch
        shell: bash
        run: python tools/patch-native-v022.py
      - name: Verify Android native version bridge
        working-directory: android-agent
        shell: bash
        run: |
          grep -q 'private val version = "0.2.2"' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'versionName = "0.2.2"' app/build.gradle.kts
      - name: Build Android APK
        working-directory: android-agent
        shell: bash
        run: |
          if [ -n "${COLLECTISH_KEYSTORE_FILE:-}" ]; then
            echo "Building persistently signed release APK."
            gradle :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/collectish-android-agent.apk"
          else
            echo "Persistent signing secrets are not configured; building debug APK."
            gradle :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/collectish-android-agent.apk"
          fi
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: collectish-android-agent
          path: ${{ runner.temp }}/collectish-android-agent.apk
