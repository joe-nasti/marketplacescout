name: Validate Collectish web and build Android

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "config.js"
      - "modern-core.js"
      - "modern-core.css"
      - "current-readonly-agent.js"
      - "current-scout-parity.js"
      - "current-scout-parity.css"
      - "current-scout-edhrec.js"
      - "current-scout-edhrec.css"
      - "current-scout-diversity.js"
      - "current-scout-noise-filter.js"
      - "current-scout-thumbnails.js"
      - "current-seller-parity.js"
      - "current-seller-parity.css"
      - "current-seller-drilldowns.js"
      - "current-seller-detail-polish.js"
      - "current-seller-overview-order-meta.js"
      - "current-seller-order-filters.js"
      - "current-syp-parity.js"
      - "current-syp-links.js"
      - "current-syp-parity.css"
      - "current-admin-scans.js"
      - "current-admin-fixed-nav.js"
      - "tools/patch-native-v021.py"
      - "tools/patch-native-v022.py"
      - "tools/patch-native-v023.py"
      - "tools/patch-native-v024.py"
      - "tools/patch-native-v025.py"
      - "tools/patch-native-v026.py"
      - "android-agent/**"
      - ".github/workflows/build-consolidated-web.yml"

permissions:
  contents: read

concurrency:
  group: collectish-unified-build
  cancel-in-progress: false

jobs:
  web-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate unified web JavaScript
        shell: bash
        run: |
          PS4='+ validate line ${LINENO}: '
          set -x
          node --check modern-core.js
          node --check current-readonly-agent.js
          node --check current-scout-parity.js
          node --check current-scout-edhrec.js
          node --check current-scout-diversity.js
          node --check current-scout-noise-filter.js
          node --check current-scout-thumbnails.js
          node --check current-seller-parity.js
          node --check current-seller-drilldowns.js
          node --check current-seller-detail-polish.js
          node --check current-seller-overview-order-meta.js
          node --check current-seller-order-filters.js
          node --check current-syp-parity.js
          node --check current-syp-links.js
          node --check current-admin-scans.js
          node --check current-admin-fixed-nav.js
          grep -q 'modern-core.js?v=0926' index.html
          grep -q "VERSION='0.9.26'" modern-core.js
          grep -q 'current-readonly-agent.js?v=0926' index.html
          grep -q "localStorage.getItem('collectishSession')" current-readonly-agent.js
          grep -q 'collectors?on_conflict=user_id,collector_id' current-readonly-agent.js
          grep -q 'rpc/claim_collector_job' current-readonly-agent.js
          grep -q "p_action:'seller_portal_readonly_probe'" current-readonly-agent.js
          grep -q 'current-seller-parity.css?v=0926' index.html
          grep -q 'current-seller-drilldowns.js?v=0926' index.html
          grep -q 'current-seller-detail-polish.js?v=0926' index.html
          grep -q 'current-seller-overview-order-meta.js?v=0926' index.html
          grep -q 'current-seller-order-filters.js?v=0926' index.html
          grep -q 'data-label="Gross"' current-seller-parity.css
          grep -q 'data-label="Fees"' current-seller-parity.css
          grep -q 'data-label="Refund"' current-seller-parity.css
          grep -q 'data-label="Net"' current-seller-parity.css
          grep -q 'grid-template-columns:repeat(4' current-seller-parity.css
          grep -q 'grid-template-columns:repeat(3' current-seller-detail-polish.js
          grep -q 'seller_order_items?select=product_id' current-seller-detail-polish.js
          grep -q 'tcgplayer.com/product/' current-seller-detail-polish.js
          grep -q 'order_fulfillment=eq.Direct' current-seller-order-filters.js
          grep -q 'order_fulfillment=eq.Normal' current-seller-order-filters.js
          grep -q 'current-syp-parity.js?v=0926' index.html
          grep -q 'current-syp-links.js?v=0926' index.html
          grep -q 'const PAGE=100' current-syp-parity.js
          grep -q 'rpc/syp_dashboard_stats' current-syp-parity.js
          grep -q 'rpc/syp_filter_options_rpc' current-syp-parity.js
          grep -q 'rpc/syp_marketplace_enrichment' current-syp-parity.js
          grep -q 'card_identity_cache' current-syp-parity.js
          grep -q 'api.scryfall.com/cards/collection' current-syp-parity.js
          grep -q 'Direct' current-syp-parity.js
          grep -q 'D qty' current-syp-parity.js
          grep -q 'Mkt listings' current-syp-parity.js
          grep -q 'data.tcgUrl' current-syp-links.js
          grep -q 'card_identity_cache' current-scout-thumbnails.js
          grep -q 'purchase_uris' current-scout-thumbnails.js
          grep -q 'limit=${limit}&offset=${offset}' current-syp-parity.js
          if grep -q '40000' current-syp-parity.js || grep -q '60000' current-syp-parity.js || grep -q 'slice(0,5000)' current-syp-parity.js; then echo 'Legacy full SYP preload/render must not return'; exit 1; fi
          grep -q 'current-admin-scans.js?v=0926' index.html
          grep -q 'current-admin-fixed-nav.js?v=0926' index.html
          grep -q 'position:fixed' current-admin-fixed-nav.js
          grep -q 'bottom:72px' current-admin-fixed-nav.js
          grep -q 'active-letter' current-admin-fixed-nav.js
          grep -q 'trackCurrentLetter' current-admin-fixed-nav.js
          grep -q 'window.addEventListener.*scroll' current-admin-fixed-nav.js
          grep -q 'Changes apply automatically' current-admin-scans.js
          grep -q 'Saving…' current-admin-scans.js
          grep -q 'printing' current-admin-scans.js
          grep -q 'current-scout-noise-filter.js?v=0926' index.html
          grep -q 'Hide Market' current-scout-noise-filter.js
          grep -q 'Open on TCGplayer' current-scout-parity.js
          grep -q 'Open on EDHREC' current-scout-parity.js
          if grep -q 'current-scout-links.js' index.html; then echo 'Legacy Scout link enhancer must not load'; exit 1; fi
          if grep -q 'current-admin-navigation.js' index.html; then echo 'Legacy Admin navigation enhancer must not load'; exit 1; fi

  android-agent:
    runs-on: ubuntu-latest
    env:
      COLLECTISH_ANDROID_KEYSTORE_B64: ${{ secrets.COLLECTISH_ANDROID_KEYSTORE_B64 }}
      COLLECTISH_KEYSTORE_PASSWORD: ${{ secrets.COLLECTISH_ANDROID_KEYSTORE_PASSWORD }}
      COLLECTISH_KEY_ALIAS: ${{ secrets.COLLECTISH_KEY_ALIAS }}
      COLLECTISH_KEY_PASSWORD: ${{ secrets.COLLECTISH_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Require persistent Collectish signing secrets
        shell: bash
        run: |
          test -n "$COLLECTISH_ANDROID_KEYSTORE_B64" || { echo "Missing COLLECTISH_ANDROID_KEYSTORE_B64"; exit 1; }
          test -n "$COLLECTISH_KEYSTORE_PASSWORD" || { echo "Missing COLLECTISH_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$COLLECTISH_KEY_ALIAS" || { echo "Missing COLLECTISH_KEY_ALIAS"; exit 1; }
          test -n "$COLLECTISH_KEY_PASSWORD" || { echo "Missing COLLECTISH_KEY_PASSWORD"; exit 1; }
      - name: Restore persistent Collectish signing key
        shell: bash
        run: |
          printf '%s' "$COLLECTISH_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/collectish-release.jks"
          test -s "$RUNNER_TEMP/collectish-release.jks"
          echo "COLLECTISH_KEYSTORE_FILE=$RUNNER_TEMP/collectish-release.jks" >> "$GITHUB_ENV"
      - name: Verify persistent signing key
        shell: bash
        run: |
          keytool -list -keystore "$COLLECTISH_KEYSTORE_FILE" -storepass "$COLLECTISH_KEYSTORE_PASSWORD" -alias "$COLLECTISH_KEY_ALIAS" >/dev/null
      - name: Apply Android patches
        shell: bash
        run: |
          python tools/patch-native-v021.py
          python tools/patch-native-v022.py
          python tools/patch-native-v023.py
          python tools/patch-native-v024.py
          python tools/patch-native-v025.py
          python tools/patch-native-v026.py
      - name: Align Android 0.2.6 version metadata
        working-directory: android-agent
        shell: bash
        run: |
          sed -i -E 's/private val version = "[0-9.]+"/private val version = "0.2.6"/' app/src/main/java/com/collectish/agent/MainActivity.kt
          sed -i -E 's/versionCode = [0-9]+/versionCode = 26/' app/build.gradle.kts
          sed -i -E 's/versionName = "[0-9.]+"/versionName = "0.2.6"/' app/build.gradle.kts
      - name: Verify unified Android shell, browser handoff and Seller claimant lifecycle
        working-directory: android-agent
        shell: bash
        run: |
          grep -q 'private val version = "0.2.6"' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'agentWeb = makeWebView().apply { alpha = 1f }' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'rootHost.addView(agentWeb, FrameLayout.LayoutParams(-1, -1))' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'fun openExternalUrl' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'Intent.ACTION_VIEW' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'hostedAgentKick' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'override fun onResume()' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'agentWeb.reload()' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'versionCode = 26' app/build.gradle.kts
          grep -q 'versionName = "0.2.6"' app/build.gradle.kts
      - name: Build persistently signed Android APK
        working-directory: android-agent
        shell: bash
        run: |
          gradle :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/collectish-android-agent.apk"
      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/collectish-android-agent.apk"
      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: collectish-android-agent-v0.2.6-signed
          path: ${{ runner.temp }}/collectish-android-agent.apk
