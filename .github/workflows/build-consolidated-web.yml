name: Build consolidated Collectish web

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build-consolidated-web.mjs"
      - "current-data.js"
      - "current-agent.js"
      - "v059.js"
      - ".github/workflows/build-consolidated-web.yml"

permissions:
  contents: write

concurrency:
  group: collectish-web-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build consolidated app
        run: node tools/build-consolidated-web.mjs
      - name: Validate JavaScript
        run: node --check collectish-app.js
      - name: Commit generated web release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collectish-app.js collectish-app.css index.html
          if git diff --cached --quiet; then
            echo "Generated web assets already current."
            exit 0
          fi
          git commit -m "Build consolidated Collectish web v0.7.4"
          git push origin HEAD:main
