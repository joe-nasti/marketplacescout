name: Validate Collectish web and build Android

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "config.js"
      - "modern-core.js"
      - "modern-core.css"
      - "current-*.js"
      - "current-*.css"
      - "tools/patch-native-v0*.py"
      - "android-agent/**"
      - ".github/workflows/build-consolidated-web.yml"

permissions:
  contents: read

concurrency:
  group: collectish-unified-build
  cancel-in-progress: false

jobs:
  web-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate hosted Collectish shell
        shell: bash
        run: |
          set -euo pipefail
          for f in modern-core.js current-*.js; do node --check "$f"; done
          grep -q "VERSION='0.9.39'" modern-core.js
          grep -q 'modern-core.js?v=0939' index.html
          grep -q 'current-scout-v5-promoted.js?v=0939' index.html
          grep -q 'current-sealed-ev.js?v=0939' index.html
          grep -q 'current-sealed-detail-focus.js?v=0939' index.html
          grep -q 'current-sealed-source-checks.js?v=0939' index.html
          grep -q 'cx-sealed-detail-open' current-sealed-detail-focus.js
          grep -q 'cx-sealed-detail-close' current-sealed-detail-focus.js
          grep -q 'cardkingdom_public' current-sealed-source-checks.js
          grep -q 'standalone-v3' current-sealed-source-checks.js
          grep -q 'scout_opportunities_v5' current-scout-v5-promoted.js
          grep -q 'DIRECT BACKED' current-scout-v5-promoted.js
          grep -q "component('Thesis'" current-scout-v5-promoted.js
          grep -q "component('Execution'" current-scout-v5-promoted.js
          grep -q "component('Exit / Floor'" current-scout-v5-promoted.js
          grep -q "component('Confirmation'" current-scout-v5-promoted.js
          grep -q "stat('TCG Market'" current-scout-v5-promoted.js
          grep -q "stat('TCG Low'" current-scout-v5-promoted.js
          grep -q "stat('TCG Direct Low'" current-scout-v5-promoted.js
          grep -q 'scout_sealed_score' current-sealed-ev.js
          grep -q "component('Economics'" current-sealed-ev.js
          grep -q "component('Exit floor'" current-sealed-ev.js
          grep -q 'market_value_coverage_pct' current-sealed-ev.js
          grep -q 'api.scryfall.com/cards/autocomplete' current-scout-global-search.js
          grep -q 'manualScoutGlobal:true' current-scout-global-search.js
          grep -q 'excluded' current-scout-global-vendor.js
          grep -q 'TCG Market = index/reference' current-scout-tcg-price-semantics.js
          grep -q 'rpc/claim_collector_job' current-readonly-agent.js
          if grep -q 'current-scout-parity.js' index.html; then echo 'Legacy Scout renderer must not load after v5 promotion'; exit 1; fi
          if grep -q 'current-scout-vendor-pricing.js' index.html; then echo 'Legacy Scout vendor detail layer must not load after v5 promotion'; exit 1; fi
          if grep -q 'current-scout-v5-preview.js' index.html; then echo 'v5 preview must not load after promotion'; exit 1; fi
          if grep -q 'current-scout-actionability-guard.js' index.html; then echo 'Legacy actionability guard must not load after v5 promotion'; exit 1; fi
          if grep -q 'current-admin-navigation.js' index.html; then echo 'Legacy Admin navigation must not load'; exit 1; fi
          if grep -q 'current-scout-links.js' index.html; then echo 'Legacy Scout links must not load'; exit 1; fi

  android-agent:
    runs-on: ubuntu-latest
    env:
      COLLECTISH_ANDROID_KEYSTORE_B64: ${{ secrets.COLLECTISH_ANDROID_KEYSTORE_B64 }}
      COLLECTISH_KEYSTORE_PASSWORD: ${{ secrets.COLLECTISH_KEYSTORE_PASSWORD }}
      COLLECTISH_KEY_ALIAS: ${{ secrets.COLLECTISH_KEY_ALIAS }}
      COLLECTISH_KEY_PASSWORD: ${{ secrets.COLLECTISH_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Require persistent signing secrets
        shell: bash
        run: |
          test -n "$COLLECTISH_ANDROID_KEYSTORE_B64"
          test -n "$COLLECTISH_KEYSTORE_PASSWORD"
          test -n "$COLLECTISH_KEY_ALIAS"
          test -n "$COLLECTISH_KEY_PASSWORD"
      - name: Restore and verify signing key
        shell: bash
        run: |
          printf '%s' "$COLLECTISH_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/collectish-release.jks"
          test -s "$RUNNER_TEMP/collectish-release.jks"
          echo "COLLECTISH_KEYSTORE_FILE=$RUNNER_TEMP/collectish-release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/collectish-release.jks" -storepass "$COLLECTISH_KEYSTORE_PASSWORD" -alias "$COLLECTISH_KEY_ALIAS" >/dev/null
      - name: Apply Android 0.2.7 patch chain
        shell: bash
        run: |
          python tools/patch-native-v021.py
          python tools/patch-native-v022.py
          python tools/patch-native-v023.py
          python tools/patch-native-v024.py
          python tools/patch-native-v025.py
          python tools/patch-native-v026.py
          python tools/patch-native-v027.py
      - name: Align and verify Android metadata
        working-directory: android-agent
        shell: bash
        run: |
          sed -i -E 's/private val version = "[0-9.]+"/private val version = "0.2.7"/' app/src/main/java/com/collectish/agent/MainActivity.kt
          sed -i -E 's/versionCode = [0-9]+/versionCode = 27/' app/build.gradle.kts
          sed -i -E 's/versionName = "[0-9.]+"/versionName = "0.2.7"/' app/build.gradle.kts
          grep -q 'SellerSyncService::class.java' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'class SellerSyncService' app/src/main/java/com/collectish/agent/SellerSyncService.kt
          grep -q 'START_STICKY' app/src/main/java/com/collectish/agent/SellerSyncService.kt
          grep -q 'android:foregroundServiceType="dataSync"' app/src/main/java/com/collectish/agent/AndroidManifest.xml || grep -q 'android:foregroundServiceType="dataSync"' app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 27' app/build.gradle.kts
          grep -q 'versionName = "0.2.7"' app/build.gradle.kts
      - name: Build persistently signed Android APK
        working-directory: android-agent
        run: |
          gradle :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/collectish-android-agent.apk"
      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/collectish-android-agent.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: collectish-android-agent-v0.2.7-signed
          path: ${{ runner.temp }}/collectish-android-agent.apk
