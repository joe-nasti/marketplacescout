name: Validate Collectish web and build Android

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "config.js"
      - "modern-core.js"
      - "modern-core.css"
      - "current-scout-parity.js"
      - "current-scout-parity.css"
      - "current-scout-edhrec.js"
      - "current-scout-edhrec.css"
      - "current-scout-diversity.js"
      - "current-seller-parity.js"
      - "current-seller-parity.css"
      - "current-syp-parity.js"
      - "current-syp-parity.css"
      - "tools/patch-native-v021.py"
      - "tools/patch-native-v022.py"
      - "tools/patch-native-v023.py"
      - "tools/patch-native-v024.py"
      - "android-agent/**"
      - ".github/workflows/build-consolidated-web.yml"

permissions:
  contents: read

concurrency:
  group: collectish-unified-build
  cancel-in-progress: false

jobs:
  web-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate unified web JavaScript
        shell: bash
        run: |
          node --check modern-core.js
          node --check current-scout-parity.js
          node --check current-scout-edhrec.js
          node --check current-scout-diversity.js
          node --check current-seller-parity.js
          node --check current-syp-parity.js
          grep -q 'modern-core.js?v=090' index.html
          grep -q "VERSION='0.9.0'" modern-core.js

  android-agent:
    runs-on: ubuntu-latest
    env:
      COLLECTISH_ANDROID_KEYSTORE_B64: ${{ secrets.COLLECTISH_ANDROID_KEYSTORE_B64 }}
      COLLECTISH_KEYSTORE_PASSWORD: ${{ secrets.COLLECTISH_KEYSTORE_PASSWORD }}
      COLLECTISH_KEY_ALIAS: ${{ secrets.COLLECTISH_KEY_ALIAS }}
      COLLECTISH_KEY_PASSWORD: ${{ secrets.COLLECTISH_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore persistent Collectish signing key
        if: ${{ env.COLLECTISH_ANDROID_KEYSTORE_B64 != '' && env.COLLECTISH_KEYSTORE_PASSWORD != '' && env.COLLECTISH_KEY_ALIAS != '' && env.COLLECTISH_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          printf '%s' "$COLLECTISH_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/collectish-release.jks"
          echo "COLLECTISH_KEYSTORE_FILE=$RUNNER_TEMP/collectish-release.jks" >> "$GITHUB_ENV"
      - name: Apply Android patches
        shell: bash
        run: |
          python tools/patch-native-v021.py
          python tools/patch-native-v022.py
          python tools/patch-native-v023.py
          python tools/patch-native-v024.py
      - name: Align Android 0.2.4 version metadata
        working-directory: android-agent
        shell: bash
        run: |
          sed -i -E 's/private val version = "[0-9.]+"/private val version = "0.2.4"/' app/src/main/java/com/collectish/agent/MainActivity.kt
          sed -i -E 's/versionCode = [0-9]+/versionCode = 24/' app/build.gradle.kts
          sed -i -E 's/versionName = "[0-9.]+"/versionName = "0.2.4"/' app/build.gradle.kts
      - name: Verify unified Android shell
        working-directory: android-agent
        shell: bash
        run: |
          grep -q 'private val version = "0.2.4"' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'agentWeb = makeWebView().apply { alpha = 1f }' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'rootHost.addView(agentWeb, FrameLayout.LayoutParams(-1, -1))' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'versionCode = 24' app/build.gradle.kts
          grep -q 'versionName = "0.2.4"' app/build.gradle.kts
      - name: Build Android APK
        working-directory: android-agent
        shell: bash
        run: |
          if [ -n "${COLLECTISH_KEYSTORE_FILE:-}" ]; then
            gradle :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/collectish-android-agent.apk"
          else
            gradle :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/collectish-android-agent.apk"
          fi
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: collectish-android-agent-v0.2.4
          path: ${{ runner.temp }}/collectish-android-agent.apk
