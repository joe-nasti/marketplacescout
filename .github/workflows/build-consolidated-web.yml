name: Validate Collectish web and build Android

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "collectish-icon-*.png"
      - "config.js"
      - "modern-core.js"
      - "modern-core.css"
      - "current-*.js"
      - "current-*.css"
      - "tools/patch-native-v0*.py"
      - "android-agent/**"
      - ".github/workflows/build-consolidated-web.yml"

permissions:
  contents: read

concurrency:
  group: collectish-unified-build
  cancel-in-progress: false

jobs:
  web-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate hosted Collectish shell
        shell: bash
        run: |
          set -euo pipefail
          for f in modern-core.js current-*.js; do node --check "$f"; done
          grep -q "VERSION='0.9.50'" modern-core.js
          grep -q 'modern-core.js?v=0950' index.html
          grep -q 'current-theme.js?v=0950' index.html
          grep -q 'current-theme.css?v=0950' index.html
          grep -q 'collectish-icon-192.png?v=0950' index.html
          grep -q 'current-ask-collectish.js?v=0950' index.html
          grep -q 'current-ask-collectish-v2.css?v=0950' index.html
          grep -q 'current-inventory-v2.js?v=0950' index.html
          grep -q "pages=\['scout','sealed','seller','syp','inventory','admin'\]" modern-core.js
          grep -q 'functions/v1/ask-collectish' current-ask-collectish.js
          grep -q 'applyUiActions' current-ask-collectish.js
          grep -q 'ask_collectish_search_syp' current-ask-collectish.js
          grep -q 'ask_collectish_search_orders' current-ask-collectish.js
          grep -q 'ask_collectish_get_inventory_aging' current-ask-collectish.js
          grep -q 'ask_collectish_save_preferences' current-ask-collectish.js
          grep -q 'cx-ai-filterbar' current-ask-collectish-v2.css
          grep -q 'Ask Collectish · AI diagnostics' current-ask-collectish.js
          grep -q 'cx-ask-panel' current-ask-collectish.css
          grep -q 'cx-brand-ish' modern-core.js
          grep -q '#0b1538' current-theme.css
          grep -q '#1866e8' current-theme.css
          grep -q '#2f8cfa' current-theme.css
          grep -q '#87b8ff' current-theme.css
          grep -q 'CollectishAndroid.*setTheme' current-theme.js
          grep -q 'current-sealed-ev.js?v=0950' index.html
          grep -q 'current-mobile-detail-swipe.js?v=0950' index.html
          grep -q 'scout_opportunities_v5' current-scout-v5-promoted.js
          test -s collectish-icon-192.png

  android-agent:
    runs-on: ubuntu-latest
    env:
      COLLECTISH_ANDROID_KEYSTORE_B64: ${{ secrets.COLLECTISH_ANDROID_KEYSTORE_B64 }}
      COLLECTISH_KEYSTORE_PASSWORD: ${{ secrets.COLLECTISH_ANDROID_KEYSTORE_PASSWORD }}
      COLLECTISH_KEY_ALIAS: ${{ secrets.COLLECTISH_ANDROID_KEY_ALIAS }}
      COLLECTISH_KEY_PASSWORD: ${{ secrets.COLLECTISH_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Require persistent signing secrets
        shell: bash
        run: |
          test -n "$COLLECTISH_ANDROID_KEYSTORE_B64"
          test -n "$COLLECTISH_KEYSTORE_PASSWORD"
          test -n "$COLLECTISH_KEY_ALIAS"
          test -n "$COLLECTISH_KEY_PASSWORD"
      - name: Restore and verify signing key
        shell: bash
        run: |
          printf '%s' "$COLLECTISH_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/collectish-release.jks"
          test -s "$RUNNER_TEMP/collectish-release.jks"
          echo "COLLECTISH_KEYSTORE_FILE=$RUNNER_TEMP/collectish-release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/collectish-release.jks" -storepass "$COLLECTISH_KEYSTORE_PASSWORD" -alias "$COLLECTISH_KEY_ALIAS" >/dev/null
      - name: Apply Android 0.2.8 patch chain
        shell: bash
        run: |
          python tools/patch-native-v021.py
          python tools/patch-native-v022.py
          python tools/patch-native-v023.py
          python tools/patch-native-v024.py
          python tools/patch-native-v025.py
          python tools/patch-native-v026.py
          python tools/patch-native-v027.py
          python tools/patch-native-v028.py
      - name: Align and verify Android metadata and branding
        working-directory: android-agent
        shell: bash
        run: |
          sed -i -E 's/private val version = "[0-9.]+"/private val version = "0.2.8"/' app/src/main/java/com/collectish/agent/MainActivity.kt
          sed -i -E 's/versionCode = [0-9]+/versionCode = 28/' app/build.gradle.kts
          sed -i -E 's/versionName = "[0-9.]+"/versionName = "0.2.8"/' app/build.gradle.kts
          grep -q 'setTheme(theme:String)' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'Color.rgb(11, 21, 56)' app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'android:icon="@drawable/collectish_launcher"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/collectish_launcher.xml
          grep -q '#0B1538' app/src/main/res/drawable/collectish_launcher.xml
          grep -q '#1866E8' app/src/main/res/drawable/collectish_launcher.xml
          grep -q 'versionCode = 28' app/build.gradle.kts
          grep -q 'versionName = "0.2.8"' app/build.gradle.kts
      - name: Build persistently signed Android APK
        working-directory: android-agent
        run: |
          gradle :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/collectish-android-agent.apk"
      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/collectish-android-agent.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: collectish-android-agent-v0.2.8-signed
          path: ${{ runner.temp }}/collectish-android-agent.apk
