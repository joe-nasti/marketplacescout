name: Collectish grounded Commander synergy recall

on:
  workflow_dispatch:
  schedule:
    - cron: "25 1,7,13,19 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/signals-synergy-grounded-recall.yml"
      - "supabase/functions/market-intel-video-synergy-grounded-recall/**"

permissions:
  contents: read

concurrency:
  group: collectish-grounded-synergy-recall
  cancel-in-progress: true

jobs:
  recall:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RECALL_URL: https://bnsnlikjeogzdubgyvxk.supabase.co/functions/v1/market-intel-video-synergy-grounded-recall
      WAKE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co/functions/v1/market-intel-synergy-scout-wake
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Grounded recall for latest Commander review
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 300 --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Content-Type: application/json" --data '{}' "$RECALL_URL")"
          cat "$response_file"; echo
          [[ "$status" =~ ^2 ]]
          test "$(jq -r '.transcript_credits_used // 0' "$response_file")" = "0"

      - name: Regression - Command Zone 759 grounded recall
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 300 --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Content-Type: application/json" --data '{"video_id":"7XpHTfYG_X0"}' "$RECALL_URL")"
          cat "$response_file"; echo
          [[ "$status" =~ ^2 ]]
          test "$(jq -r '.transcript_credits_used // 0' "$response_file")" = "0"

          jq -e '.relationships | any(.source_card == "Sash and Waistcoat, Unmen" and .target_card == "Training Grounds")' "$response_file" >/dev/null
          jq -e '.relationships | any(.source_card == "The Madcap Jester" and .target_card == "Tasha'"'"'s Hideous Laughter")' "$response_file" >/dev/null
          jq -e '.relationships | any(.source_card == "The Madcap Jester" and .target_card == "Extract")' "$response_file" >/dev/null
          jq -e '.relationships | any(.source_card == "The Muckslinger Gang" and .target_card == "Outcaster Trailblazer")' "$response_file" >/dev/null

          targets="$(jq -r '[.relationships[]?.target_card] | unique | join("|")' "$response_file")"
          echo "grounded_targets=$targets"
          for forbidden in "Hardened Academic" "Possibility Storm" "Dread" "Anoint" "Together as One" "Enrage" "Exile" "The Command Zone" "Onslaught" "Blink"; do
            echo "$targets" | grep -Fq "$forbidden" && { echo "forbidden/noisy target returned: $forbidden"; exit 1; } || true
          done

      - name: Wake Scout for newly recovered synergies
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 120 --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Content-Type: application/json" --data '{"min_conviction":0.78,"limit":20,"cooldown_hours":6}' "$WAKE_URL")"
          cat "$response_file"; echo
          [[ "$status" =~ ^2 ]]
