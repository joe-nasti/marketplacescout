name: Materialize Android source

on:
  push:
    paths:
      - ".github/workflows/materialize-android-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collectish-materialize-android-source
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Apply historical patch chain once
        shell: bash
        run: |
          set -euo pipefail
          for patch in \
            tools/patch-native-v021.py \
            tools/patch-native-v022.py \
            tools/patch-native-v023.py \
            tools/patch-native-v024.py \
            tools/patch-native-v025.py \
            tools/patch-native-v026.py \
            tools/patch-native-v027.py \
            tools/patch-native-v028.py \
            tools/patch-native-v030.py \
            tools/patch-native-v031.py \
            tools/patch-native-v032.py \
            tools/patch-native-v033.py \
            tools/patch-native-v034.py \
            tools/patch-native-v035.py \
            tools/patch-native-v036.py
          do
            python "$patch"
          done

      - name: Stamp canonical Android version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          main = Path('android-agent/app/src/main/java/com/collectish/agent/MainActivity.kt')
          text = main.read_text()
          text = re.sub(r'private val version = "[0-9.]+"', 'private val version = "0.2.15"', text)
          main.write_text(text)

          gradle = Path('android-agent/app/build.gradle.kts')
          text = gradle.read_text()
          text = re.sub(r'versionCode = \d+', 'versionCode = 35', text)
          text = re.sub(r'versionName = "[0-9.]+"', 'versionName = "0.2.15"', text)
          gradle.write_text(text)
          PY

      - name: Validate canonical Android source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'private val version = "0.2.15"' android-agent/app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'versionCode = 35' android-agent/app/build.gradle.kts
          grep -q 'versionName = "0.2.15"' android-agent/app/build.gradle.kts
          grep -q '/admin/product/searchcatalog' android-agent/app/src/main/java/com/collectish/agent/ReadOnlyProbePolicy.kt
          grep -q '/admin/product/updateinstockquantities' android-agent/app/src/main/java/com/collectish/agent/ReadOnlyProbePolicy.kt
          grep -q 'fetch_html' android-agent/app/src/main/java/com/collectish/agent/ReadOnlyProbeBridge.kt
          grep -q 'loginByUrl' android-agent/app/src/main/java/com/collectish/agent/ReadOnlyProbeBridge.kt
          grep -q 'text = "← Collectish"' android-agent/app/src/main/java/com/collectish/agent/MainActivity.kt
          grep -q 'sellerReturn.visibility=View.VISIBLE' android-agent/app/src/main/java/com/collectish/agent/MainActivity.kt
          (cd android-agent && gradle :app:assembleDebug)

      - name: Commit canonical Android source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-agent
          git diff --cached --quiet && { echo "No Android source changes to commit"; exit 0; }
          git commit -m "refactor: materialize canonical Android source"
          git push origin HEAD:${GITHUB_REF_NAME}
