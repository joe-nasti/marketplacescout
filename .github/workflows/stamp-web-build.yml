name: Stamp web build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build-version.json'
      - '.github/workflows/stamp-web-build.yml'
      - 'cloud-worker/**'
      - 'supabase/**'
      - 'android/**'

permissions:
  contents: write

concurrency:
  group: collectish-web-build-stamp
  cancel-in-progress: true

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp deployed web build marker
        run: |
          printf '{"build":"%s","deployed_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build-version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-version.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: stamp web build [skip ci]"
          git push
