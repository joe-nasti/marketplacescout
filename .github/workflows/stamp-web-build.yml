name: Stamp web build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build-version.json'
      - '.github/workflows/stamp-web-build.yml'
      - 'cloud-worker/**'
      - 'supabase/**'
      - 'android/**'

permissions:
  contents: write

concurrency:
  group: collectish-web-build-stamp
  cancel-in-progress: true

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp build into index and marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, re, datetime
          sha=os.environ['GITHUB_SHA']
          p=Path('index.html')
          s=p.read_text()
          meta=f'<meta name="collectish-build" content="{sha}">'
          pat=r'<meta name="collectish-build" content="[^"]*">'
          if re.search(pat,s):
              s=re.sub(pat,meta,s)
          else:
              needle='<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
              s=s.replace(needle,needle+'\n  '+meta)
          p.write_text(s)
          Path('build-version.json').write_text(json.dumps({
              'build':sha,
              'deployed_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          },separators=(',',':'))+'\n')
          PY
      - name: Commit build stamp
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build-version.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: stamp web build [skip ci]"
          git push
