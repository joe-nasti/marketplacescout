name: Refresh sealed set mapping

on:
  workflow_dispatch:
  push:
    paths:
      - "cloud-worker/mtgjson-set-sealed-sync.py"
      - ".github/workflows/refresh-sealed-set-mapping.yml"

permissions:
  contents: read

concurrency:
  group: collectish-sealed-set-mapping
  cancel-in-progress: false

jobs:
  map-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://bnsnlikjeogzdubgyvxk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MTGJSON_BASE_URL: https://mtgjson.com/api/v5
      PRECON_RELEASE_FROM: "2025-01-01"
      PRECON_DIRECT_MIN_MARKET: "1"
      PRECON_DIRECT_CONCURRENCY: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require service key
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Validate sealed mapping worker
        run: |
          python -m py_compile cloud-worker/mtgjson-set-sealed-sync.py
          node --check cloud-worker/refresh-sealed-commander-prices.mjs cloud-worker/refresh-precon-direct.mjs cloud-worker/refresh-precon-ev.mjs
      - name: Enrich all sealed products from native MTGJSON set JSON
        run: python cloud-worker/mtgjson-set-sealed-sync.py
      - name: Refresh TCG sealed acquisition prices
        run: node cloud-worker/refresh-sealed-commander-prices.mjs
      - name: Recalculate sealed EV
        run: node cloud-worker/refresh-precon-ev.mjs
      - name: Refresh economically meaningful Direct components
        run: node cloud-worker/refresh-precon-direct.mjs
      - name: Recalculate sealed EV with fresh Direct
        run: node cloud-worker/refresh-precon-ev.mjs
